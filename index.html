<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120e17">
<meta name="description" content="Nebrukaddesar: Mürekkep ve İnci. Turgut Can Koloğlugil'in romanından piksel sanat zar ve kart oyunu.">
</head>
<body style="margin:0;background:#120e17">
<title>Nebrukaddesar: Mürekkep ve İnci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Düzen: dikey tek ekran oyun; üst çubuk, sahne, anlatım, el, alt çubuk. Minyatür + 16-bit. Tek tema: gece mürekkebi. */
:root {
  --ink: #15111c; --ink2: #1d1727; --panel: #2a2038; --panel2: #352a46; --line: #0b0910;
  --parsomen: #e9dfc6; --parsomen2: #cdbf9d; --kahve: #3b2a1e;
  --safran: #dfa52a; --safran2: #f4d27a; --firuze: #2b9c94; --kan: #b4203a; --mor: #8a4fd1; --mor2: #b99af0;
  --pas: #9a3a28; --lacivert: #1f2f5c; --yesil: #5f7a3c; --kor: #ea4a26;
  --metin: #efe8d8; --soluk: #a59cb4;
  --f-ust: 'Pixelify Sans', 'Silkscreen', ui-monospace, 'Courier New', monospace;
  --f-govde: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --f-sayi: 'Silkscreen', 'Pixelify Sans', ui-monospace, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--line); color: var(--metin); font-family: var(--f-govde); font-size: 16px; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.icow { display: inline-flex; vertical-align: middle; }
button { font-family: var(--f-ust); color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 2px solid var(--safran2); outline-offset: 2px; }
b { color: var(--safran2); font-weight: 600; }

#app { position: relative; max-width: 460px; height: 100%; margin: 0 auto; background: var(--ink); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 0 2px var(--line), 0 0 40px #000; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }

/* Piksel çerçeveler (tezhip etkisi) */
.cerceve { border: 2px solid var(--line); box-shadow: inset 0 0 0 2px var(--safran), inset 0 0 0 4px var(--line); }
.btn { font-size: 17px; padding: 10px 14px; background: var(--panel2); border: 2px solid var(--line); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.08); color: var(--metin); text-align: left; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.35); }
.btn.ana { background: var(--safran); color: var(--ink); font-weight: 600; text-align: center; }
.btn.kan { background: var(--kan); color: #fff; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn small { display: block; font-size: 13px; color: var(--soluk); margin-top: 2px; font-family: var(--f-govde); }
.btn.ana small { color: #3b2a1e; }

/* Üst çubuk */
.ust { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--ink2); border-bottom: 2px solid var(--line); font-family: var(--f-sayi); font-size: 12px; min-height: 40px; }
.ust .v { display: flex; align-items: center; gap: 4px; }
.ust .bos { flex: 1; }
.ust button { padding: 4px; }
.ust .hp { color: #ff8c97; }
.ust .alt { color: var(--safran2); }

/* Başlık */
.baslik { justify-content: flex-end; }
.baslik .bgw { position: absolute; inset: 0; }
.baslik .bgw canvas { width: 100%; height: 100%; object-fit: cover; }
.baslik .ic { position: relative; padding: 0 16px 28px; display: flex; flex-direction: column; gap: 10px; }
.logo { text-align: center; margin-bottom: 8px; }
.logo h1 { font-family: var(--f-ust); font-weight: 700; font-size: clamp(30px, 9.5vw, 42px); letter-spacing: 1px; margin: 0; color: var(--safran2); text-shadow: 3px 3px 0 var(--line), -1px -1px 0 var(--pas); }
.logo p { margin: 4px 0 0; font-size: 18px; color: var(--mor2); letter-spacing: 3px; text-transform: uppercase; font-family: var(--f-sayi); font-size: 13px; }
.baslik .sar { display: flex; justify-content: center; margin-bottom: 4px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.5)); }
.alt-not { text-align: center; font-size: 12px; color: var(--soluk); }

/* İsimur anlatı kutusu */
.anlat { position: relative; background: var(--parsomen); color: var(--kahve); padding: 14px 16px; font-size: 17px; line-height: 1.38; border: 2px solid var(--line); box-shadow: inset 0 0 0 3px var(--parsomen2), 4px 4px 0 var(--line); }
.anlat .kim { position: absolute; top: -12px; left: 12px; background: var(--lacivert); color: var(--parsomen); font-family: var(--f-sayi); font-size: 11px; padding: 3px 8px; border: 2px solid var(--line); }
.anlat b { color: var(--pas); }
.sahne-res { position: relative; border-bottom: 2px solid var(--line); }
.sahne-res > canvas.bg { width: 100%; height: auto; aspect-ratio: 180 / 110; }
.sahne-res .por { position: absolute; left: 12px; bottom: -14px; background: var(--ink2); border: 2px solid var(--line); box-shadow: inset 0 0 0 2px var(--safran); padding: 6px; }
.olay-ic { flex: 1; overflow-y: auto; padding: 26px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.olay-ic h2 { margin: 0; font-size: 22px; color: var(--safran2); font-weight: 600; text-wrap: balance; }
.secenek { display: flex; flex-direction: column; gap: 8px; }
.kontrol { font-family: var(--f-sayi); font-size: 11px; color: var(--mor2); margin-top: 4px; display: block; }
.btn.ana .kontrol { color: var(--kahve); }

/* Harita */
.harita-ust { padding: 10px 16px 8px; background: var(--ink2); border-bottom: 2px solid var(--line); display: flex; align-items: center; gap: 10px; }
.harita-ust h2 { margin: 0; font-size: 18px; color: var(--safran2); font-weight: 600; flex: 1; }
.harita-ust small { display: block; color: var(--soluk); font-size: 13px; font-weight: 400; }
.harita-kay { flex: 1; overflow-y: auto; position: relative; background:
  radial-gradient(circle at 50% 30%, rgba(223,165,42,.06), transparent 60%), var(--ink); }
.harita { position: relative; margin: 0 auto; width: 100%; max-width: 420px; }
.harita svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dugum { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--line); box-shadow: inset 0 0 0 2px #3d3150; }
.dugum.gecti { opacity: .38; filter: grayscale(.6); }
.dugum.burada { box-shadow: inset 0 0 0 2px var(--safran2); }
.dugum.acik { animation: nabiz 1.1s steps(2) infinite; box-shadow: inset 0 0 0 2px var(--safran); background: var(--panel2); }
.dugum.kapali { opacity: .7; }
.dugum.boss { width: 64px; height: 64px; margin: -32px 0 0 -32px; background: #3a1520; }
@keyframes nabiz { 50% { transform: scale(1.12); } }
.efsane { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 8px 16px; font-size: 13px; color: var(--soluk); background: var(--ink2); border-top: 2px solid var(--line); }
.efsane span { display: inline-flex; gap: 4px; align-items: center; }

/* Savaş */
.sahne { position: relative; flex: 1; min-height: 210px; overflow: hidden; border-bottom: 2px solid var(--line); }
.sahne > canvas.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
.sahne::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,17,28,.2), rgba(21,17,28,.0) 40%, rgba(21,17,28,.75)); pointer-events: none; }
.sahne > * { z-index: 1; }
.sahne > canvas.bg { z-index: 0; }
.dusmanlar { position: absolute; left: 0; right: 0; top: 6px; bottom: 40%; display: flex; justify-content: center; align-items: flex-end; gap: 6px; padding: 0 12px; }
.dusman { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 4px; transition: opacity .3s; }
.dusman .spr { filter: drop-shadow(0 3px 0 rgba(0,0,0,.55)); }
.dusman.hedef .spr { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 2px 0 var(--safran2)) drop-shadow(0 -2px 0 var(--safran2)); animation: secim .6s steps(2) infinite; }
@keyframes secim { 50% { transform: translateY(-2px); } }
.dusman.olu { opacity: 0; pointer-events: none; }
.dusman.gizli .spr { opacity: .25; filter: blur(1px) grayscale(1); }
.dusman.vur { animation: titre .25s steps(3); }
@keyframes titre { 33% { transform: translateX(-4px); } 66% { transform: translateX(4px); } }
.niyet { display: flex; align-items: center; gap: 2px; background: var(--ink2); border: 2px solid var(--line); padding: 1px 5px 1px 2px; font-family: var(--f-sayi); font-size: 11px; color: #ffb3a6; white-space: nowrap; }
.niyet.blok { color: #a9c6ff; } .niyet.guc { color: var(--safran2); } .niyet.gizli { color: var(--mor2); }
.cubuk { width: 64px; height: 8px; background: var(--line); border: 1px solid var(--line); position: relative; }
.cubuk i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--kan); }
.cubuk.oy i { background: #4ec25a; }
.cubuk em { position: absolute; inset: -5px 0 auto; text-align: center; font-family: var(--f-sayi); font-size: 9px; font-style: normal; color: #fff; text-shadow: 1px 1px 0 #000; line-height: 18px; }
.etiket { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 96px; }
.dur { font-family: var(--f-sayi); font-size: 9px; padding: 1px 3px; background: var(--ink2); border: 1px solid var(--line); color: var(--metin); }
.dur.blok { background: #22385e; } .dur.kot { background: #4a1b25; } .dur.iyi { background: #2b4a2b; } .dur.zs { background: #3d3150; }
.oyuncu { position: absolute; left: 10px; bottom: 6px; display: flex; align-items: flex-end; gap: 8px; }
.oyuncu .spr { filter: drop-shadow(0 3px 0 rgba(0,0,0,.6)); }
.oyuncu.acı .spr { animation: titre .25s steps(3); filter: drop-shadow(0 0 0 #f00) sepia(1) saturate(4) hue-rotate(-30deg); }
.oyuncu .bilgi { display: flex; flex-direction: column; gap: 3px; padding-bottom: 6px; }
.kolla { position: absolute; right: 10px; bottom: 10px; font-size: 13px; padding: 6px 8px; }
.sayi-uc { position: absolute; font-family: var(--f-sayi); font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: uc .9s ease-out forwards; z-index: 5; }
.sayi-uc.kritik { color: var(--safran2); font-size: 24px; }
.sayi-uc.blok { color: #a9c6ff; }
@keyframes uc { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-36px); opacity: 0; } }

.anlati { min-height: 44px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; background: var(--ink2); border-bottom: 2px solid var(--line); font-size: 14px; line-height: 1.25; color: var(--parsomen); }
.anlati .t { flex: 1; }

.el-alan { position: relative; padding: 8px 12px 6px; }
.el { display: flex; justify-content: center; min-height: 112px; }
.kart { position: relative; flex: 0 0 auto; width: var(--kw, 76px); height: 112px; background: var(--panel); border: 2px solid var(--line); box-shadow: inset 0 0 0 2px var(--kc, #4a3f5a); display: flex; flex-direction: column; align-items: center; padding: 14px 3px 4px; gap: 2px; transition: transform .12s; color: var(--metin); }
.kart.kilic { --kc: var(--pas); background: #3a2420; }
.kart.kalem { --kc: #3a5296; background: #1f2440; }
.kart.kelam { --kc: var(--safran); background: #3a2e1a; }
.kart.secili { transform: translateY(-14px); box-shadow: inset 0 0 0 2px var(--safran2), 0 0 0 2px var(--safran2); z-index: 3; }
.kart.pahali { filter: grayscale(.7) brightness(.7); }
.kart .mal { position: absolute; top: -6px; left: -6px; width: 22px; height: 24px; display: grid; place-items: center; font-family: var(--f-sayi); font-size: 12px; color: #fff; background: var(--lacivert); border: 2px solid var(--line); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
.kart .ad { font-size: 12px; line-height: 1.05; text-align: center; font-weight: 600; min-height: 26px; display: flex; align-items: center; }
.kart .res { flex: 1; display: grid; place-items: center; }
.kart .tur { font-family: var(--f-sayi); font-size: 8px; color: var(--soluk); }
.kart.arti .ad { color: #9ff0a5; }
.kart.buyuk { width: 132px; height: 190px; padding-top: 20px; }
.kart.buyuk .ad { font-size: 17px; min-height: 40px; }
.kart.buyuk .mal { width: 30px; height: 32px; font-size: 16px; }
.kart.buyuk .tur { font-size: 10px; }
.kart .acik { font-size: 12px; line-height: 1.2; text-align: center; color: var(--parsomen); padding: 0 4px; }
.alt { display: flex; align-items: center; gap: 10px; padding: 6px 12px 10px; }
.murekkep { display: flex; align-items: center; gap: 2px; font-family: var(--f-sayi); font-size: 14px; color: #9db8ff; }
.murekkep .bos { opacity: .25; }
.yigin { font-family: var(--f-sayi); font-size: 10px; color: var(--soluk); display: flex; flex-direction: column; gap: 2px; }
.alt .bos { flex: 1; }

/* Seçili kart paneli */
.detay { position: absolute; left: 12px; right: 12px; bottom: calc(100% + 6px); background: var(--ink2); border: 2px solid var(--line); box-shadow: inset 0 0 0 2px var(--safran), 0 6px 0 rgba(0,0,0,.4); padding: 10px 12px; display: flex; gap: 12px; z-index: 6; }
.detay .metin { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.detay h3 { margin: 0; font-size: 18px; color: var(--safran2); font-weight: 600; }
.detay .k { font-family: var(--f-sayi); font-size: 10px; color: var(--soluk); }
.detay p { margin: 0; font-size: 15px; line-height: 1.3; }
.detay .sans { font-family: var(--f-sayi); font-size: 11px; color: var(--mor2); }
.detay .dg { display: flex; gap: 8px; margin-top: auto; }
.detay .dg .btn { padding: 8px 12px; font-size: 15px; }

/* Zar katmanı */
#zar { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 40; }
#zar[hidden] { display: none !important; }
.zar-kutu { background: rgba(11,9,16,.9); border: 2px solid var(--line); box-shadow: inset 0 0 0 2px var(--mor), 0 0 0 4px rgba(0,0,0,.4); padding: 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 220px; max-width: 86vw; }
.zar-kutu .bas { font-size: 13px; color: var(--soluk); text-align: center; }
.zarlar { display: flex; gap: 10px; }
.zar-tek { position: relative; width: 72px; height: 72px; display: grid; place-items: center; }
.zar-tek canvas { position: absolute; inset: 0; width: 72px; height: 72px; }
.zar-tek.don canvas { animation: don .14s steps(4) infinite; }
@keyframes don { to { transform: rotate(90deg); } }
.zar-tek span { position: relative; font-family: var(--f-sayi); font-size: 22px; color: var(--ink); text-shadow: 0 0 2px #fff; }
.zar-tek.sonuk { opacity: .35; }
.zar-tek.yirmi span { color: #a8700a; } .zar-tek.bir span { color: var(--kan); }
.zar-kutu .form { font-family: var(--f-sayi); font-size: 12px; color: var(--metin); text-align: center; }
.zar-kutu .hukum { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.hukum.iyi { color: #8ff09a; } .hukum.kot { color: #ff7a85; } .hukum.altin { color: var(--safran2); }
.kritik-isik { animation: isik .5s steps(4); }
@keyframes isik { 0% { box-shadow: inset 0 0 0 200px rgba(244,210,122,.5); } }
.sars { animation: sars .3s steps(4); }
@keyframes sars { 25% { transform: translate(2px,-2px); } 50% { transform: translate(-2px,2px); } 75% { transform: translate(2px,2px); } }

/* Modal */
#modal { position: fixed; inset: 0; background: rgba(5,4,8,.78); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal[hidden] { display: none !important; }
.mpanel { width: 100%; max-width: 430px; max-height: 88vh; overflow-y: auto; background: var(--ink2); border: 2px solid var(--line); box-shadow: inset 0 0 0 2px var(--safran), 6px 6px 0 #000; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.mpanel h2 { margin: 0; font-size: 22px; color: var(--safran2); font-weight: 600; }
.mpanel h3 { margin: 6px 0 0; font-size: 15px; color: var(--mor2); font-family: var(--f-sayi); font-weight: 400; }
.mpanel p { margin: 0; line-height: 1.35; }
.kart-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px 6px; justify-items: center; padding-top: 8px; }
.yetenek { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.yt { background: var(--panel); border: 2px solid var(--line); padding: 6px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.yt .k { font-family: var(--f-sayi); font-size: 10px; color: var(--soluk); }
.yt .p { font-size: 24px; font-weight: 600; }
.yt .m { font-family: var(--f-sayi); font-size: 11px; color: var(--safran2); }
button.yt:active { transform: translateY(2px); }
.liste { display: flex; flex-direction: column; gap: 6px; }
.satir { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 2px solid var(--line); padding: 8px; }
.satir .t { flex: 1; min-width: 0; }
.satir .t b { display: block; }
.satir .t span { font-size: 14px; color: var(--soluk); line-height: 1.25; display: block; }
.terazi { position: relative; height: 14px; background: linear-gradient(90deg, #e6e0d2, #8a84a4 50%, var(--kor)); border: 2px solid var(--line); }
.terazi i { position: absolute; top: -5px; width: 6px; height: 20px; margin-left: -3px; background: var(--ink); border: 2px solid var(--safran2); }
.terazi-et { display: flex; justify-content: space-between; font-family: var(--f-sayi); font-size: 10px; color: var(--soluk); }
.ayar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* Ödül, seviye */
.odul { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.odul h2 { margin: 0; font-size: 24px; color: var(--safran2); font-weight: 600; text-align: center; }
.odul .sec { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.odul .kart { cursor: pointer; }
.odul .kart.buyuk { width: 112px; height: auto; min-height: 200px; padding-bottom: 8px; }
.odul .kart.buyuk .ad { font-size: 14px; min-height: 34px; }
.odul .kart.buyuk .acik { font-size: 11.5px; }
.ortala { text-align: center; color: var(--soluk); font-size: 14px; }

#toast { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
.tst { background: var(--ink2); border: 2px solid var(--line); box-shadow: inset 0 0 0 2px var(--firuze); padding: 5px 10px; font-size: 14px; animation: tst 2.4s forwards; white-space: nowrap; }
@keyframes tst { 0% { opacity: 0; transform: translateY(-6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; } }
@media (max-width: 370px) { .kart { height: 104px; } .kart .ad { font-size: 11px; } .anlat { font-size: 16px; } }
</style>
<div id="app"></div>
<div id="zar" hidden></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<style>
/* v2: taş + pirinç arayüz, boyanmış sahne */
:root { --pirinc: #c99a4a; --pirinc2: #f0c873; --pirinc3: #5a3d1a; }
.v2 .ust { background: var(--tas) repeat, #2c2633; background-size: 96px; border-bottom: 0; box-shadow: inset 0 -2px 0 var(--pirinc3), inset 0 -4px 0 var(--pirinc), 0 2px 0 #000; image-rendering: pixelated; }
.v2s .sahne { border-bottom: 0; min-height: 0; }
.v2s .sahne > canvas.bg2 { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; image-rendering: pixelated; z-index: 0; }
.v2s .sahne::after { display: none; }
.v2s .kivilcim { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: .9; }
.isiklar { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.mesale { position: absolute; width: 140px; height: 140px; margin: -80px 0 0 -70px; background: radial-gradient(circle, rgba(255,150,60,.32), rgba(234,74,38,.08) 45%, transparent 70%); mix-blend-mode: screen; animation: titres 1.6s steps(6) infinite; }
.mesale:nth-child(2) { animation-delay: -.7s; }
@keyframes titres { 0%,100% { opacity: .85; transform: scale(1); } 30% { opacity: 1; transform: scale(1.06); } 60% { opacity: .7; transform: scale(.96); } }

.hud { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 92px; min-height: 60px; background: var(--tas), #2c2633; background-size: 96px; image-rendering: pixelated; box-shadow: inset 0 2px 0 var(--pirinc3), inset 0 4px 0 var(--pirinc), inset 0 6px 0 #000, inset 0 -2px 0 #000; }

.btn.tunc { background: linear-gradient(#e6b65c, #b8893a 55%, #8a5f22); color: #2a1a0c; border: 2px solid #000; box-shadow: inset 0 2px 0 #ffe0a0, inset 0 -3px 0 #5a3d1a; font-weight: 700; }

.zar-kutu { background: var(--tas, none), rgba(20,15,24,.95); background-size: 96px; box-shadow: inset 0 0 0 2px var(--pirinc, #c99a4a), inset 0 0 0 4px #000, 0 0 0 4px rgba(0,0,0,.4); }

/* ---- ışık türleri ---- */
.mesale.mum { width: 110px; height: 110px; margin: -55px 0 0 -55px; background: radial-gradient(circle, rgba(255,170,80,.30), rgba(234,120,38,.07) 45%, transparent 70%); animation-duration: 2.2s; }
.mesale.fener { width: 120px; height: 120px; margin: -60px 0 0 -60px; background: radial-gradient(circle, rgba(255,150,60,.28), rgba(234,90,38,.06) 45%, transparent 70%); animation-duration: 3s; }
/* ---- efekt katmanı ---- */
.fx-katman { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; image-rendering: pixelated; }
.flas { position: absolute; inset: 0; z-index: 6; pointer-events: none; mix-blend-mode: screen; animation: flas .16s ease-out forwards; }
@keyframes flas { from { opacity: 1; } to { opacity: 0; } }
.sahne.sars-k { animation: sarsK .26s steps(4); }
.sahne.sars-b { animation: sarsB .42s steps(6); }
@keyframes sarsK { 25% { transform: translate(-3px, 1px); } 50% { transform: translate(3px, -2px); } 75% { transform: translate(-2px, 2px); } }
@keyframes sarsB { 15% { transform: translate(-6px, 2px); } 30% { transform: translate(6px, -3px); } 45% { transform: translate(-5px, 3px); } 60% { transform: translate(4px, -2px); } 80% { transform: translate(-2px, 1px); } }
.oyuncu .spr.savur { animation: savur .36s cubic-bezier(.3,.0,.2,1); transform-origin: 40% 90%; }
@keyframes savur { 0% { transform: none; } 30% { transform: rotate(-7deg) translate(-6px, 4px); } 55% { transform: rotate(5deg) translate(18px, -10px); } 100% { transform: none; } }
.dusman.beyaz .spr canvas { filter: brightness(0) invert(1); }
.dusman.geri .spr { animation: geri .32s ease-out; }
@keyframes geri { 0% { transform: translate(0,0); } 25% { transform: translate(12px, -4px) rotate(4deg); } 100% { transform: none; } }
.dusman.kac .spr { animation: kac .42s ease-out; }
@keyframes kac { 0% { transform: none; } 30% { transform: translate(16px, -2px) skewX(-8deg); opacity: .7; } 100% { transform: none; } }
.dusman.hamle .spr { animation: hamle .38s cubic-bezier(.5,0,.4,1); }
@keyframes hamle { 0% { transform: none; } 30% { transform: translate(8px, -6px) scale(1.02); } 55% { transform: translate(-34px, 26px) scale(1.12); } 100% { transform: none; } }
.oyuncu.sendele .spr { animation: sendele .32s ease-out; }
@keyframes sendele { 0% { transform: none; } 25% { transform: translate(-10px, 4px) rotate(-4deg); filter: brightness(2) sepia(1) hue-rotate(-40deg) saturate(5); } 100% { transform: none; } }
.v2s .oyuncu.acı .spr { animation: none; filter: none; }
.v2s .dusman.olu { transition: opacity .12s; }
.dusman.cozuldu .spr canvas { visibility: hidden; }
.sira-afis { position: absolute; left: 0; right: 0; top: 40%; z-index: 7; display: flex; justify-content: center; pointer-events: none; animation: afis 1.1s ease-in-out forwards; }
.sira-afis span { font-family: var(--f-ust); font-weight: 700; font-size: 20px; letter-spacing: 3px; color: var(--pirinc2); text-shadow: 2px 2px 0 #000, 0 0 12px rgba(240,200,115,.6); padding: 6px 28px; background: linear-gradient(90deg, transparent, rgba(12,8,16,.85) 20%, rgba(12,8,16,.85) 80%, transparent); border-top: 2px solid var(--pirinc3); border-bottom: 2px solid var(--pirinc3); }
.sira-afis.dusman span { color: #ff8a8a; text-shadow: 2px 2px 0 #000, 0 0 12px rgba(224,74,90,.7); border-color: #5a1626; }
@keyframes afis { 0% { opacity: 0; transform: scaleX(.3); } 15% { opacity: 1; transform: scaleX(1.04); } 25% { transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
.kart-uc { position: fixed; z-index: 30; pointer-events: none; border: 2px solid #000; background: radial-gradient(circle, #f4d27a, #b8893a 50%, #5a3d1a); box-shadow: 0 0 16px rgba(244,210,122,.8); }
.kart-uc.kalem { background: radial-gradient(circle, #cfe0ff, #3a5296 60%, #1f2f5c); box-shadow: 0 0 16px rgba(120,160,255,.8); }
.kart-uc.kelam { background: radial-gradient(circle, #ffd0e0, #a57bc8 60%, #3d2a4a); box-shadow: 0 0 16px rgba(200,140,220,.8); }
.v2s .sayi-uc { z-index: 8; }
.sayi-uc.kritik { font-size: 28px; color: #f4d27a; animation-duration: 1.1s; }
/* ---- 3B zar ---- */
.zar3 .zar-tek { width: 128px; height: 128px; }
.zar3 .zar-tek canvas { width: 128px; height: 128px; animation: none !important; }
.zar3 .zarlar:has(.zar-tek + .zar-tek) .zar-tek, .zar3 .zarlar:has(.zar-tek + .zar-tek) canvas { width: 112px; height: 112px; }
.zar3 .zar-tek.secik { filter: drop-shadow(0 0 6px rgba(244,210,122,.6)); }
.zar3 .zar-tek.yirmi { filter: drop-shadow(0 0 12px #f4d27a); animation: yirmi .5s ease-out; }
@keyframes yirmi { 0% { transform: scale(1.3); } 100% { transform: none; } }
.zar3 .zar-tek.bir canvas { filter: grayscale(.6) brightness(.6); }
.zar3 .hukum { animation: hukum .3s ease-out; }
@keyframes hukum { 0% { transform: scale(1.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.zar3 .hukum.altin { color: #f4d27a; text-shadow: 0 0 10px rgba(244,210,122,.8), 2px 2px 0 #000; }

/* ===== v2: tüm ekranlar ===== */
.v2 { background: #0e0b13; }
.v2 .kivilcim { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: .9; image-rendering: pixelated; }
.v2 canvas.bg2 { image-rendering: pixelated; }
/* düğmeler: taş levha + pirinç kenar */
.v2 .btn { background: var(--tas), #2c2633; background-size: 96px; image-rendering: pixelated; border: 2px solid #000; box-shadow: inset 0 0 0 2px var(--pirinc3), inset 0 2px 0 rgba(255,255,255,.06), 0 3px 0 #000; color: #efe8d8; text-shadow: 1px 1px 0 #000; }
.v2 .btn small { color: #b8aec4; text-shadow: none; }
.v2 .btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--pirinc3), 0 1px 0 #000; }
.v2 .btn.ana { background: linear-gradient(#e6b65c, #b8893a 55%, #8a5f22); color: #2a1a0c; text-shadow: 0 1px 0 rgba(255,230,170,.5); box-shadow: inset 0 2px 0 #ffe0a0, inset 0 -3px 0 #5a3d1a, 0 3px 0 #000; }
.v2 .btn.ana small { color: #4a2e10; }
.v2 .btn.kan { background: linear-gradient(#e04a5a, #b4203a 55%, #6e1226); color: #fff; }

/* başlık ekranı */
.v2 .baslik .bgw canvas.bg2 { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.v2 .baslik .bgw::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(8,6,12,.85) 80%); }
.v2 .logo h1 { color: #f0c873; text-shadow: 0 3px 0 #5a3d1a, 0 5px 0 #000, 0 0 18px rgba(240,200,115,.35); letter-spacing: 2px; }
.v2 .logo p { color: #c9b8e8; text-shadow: 1px 1px 0 #000; }
.v2 .baslik .sar { filter: drop-shadow(0 4px 0 rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(240,180,90,.25)); }
/* anlatı sahnesi */
.v2 .sahne-res { overflow: visible; border-bottom: 0; box-shadow: 0 2px 0 var(--pirinc3), 0 4px 0 var(--pirinc), 0 6px 0 #000; z-index: 2; }
.v2 .sahne-res > canvas.bg { display: block; width: 100%; height: auto; aspect-ratio: 240 / 146; position: relative; }
.v2 .sahne-res .isiklar, .v2 .sahne-res .kivilcim { position: absolute; inset: 0; overflow: hidden; }
.v2 .sahne-res .por { z-index: 3; background: radial-gradient(circle at 50% 40%, #3a2a3c, #120d14 75%); border: 2px solid #000; box-shadow: inset 0 0 0 2px var(--pirinc), inset 0 0 0 4px #000, 0 4px 0 rgba(0,0,0,.5); padding: 6px; }
.v2 .sahne-res .por canvas { display: block; }
.v2 .screen:has(.olay-ic) { background: var(--tas), #1a1520; background-size: 96px; image-rendering: pixelated; }
.v2 .olay-ic { background: linear-gradient(rgba(14,11,19,.82), rgba(14,11,19,.92)); image-rendering: auto; }
.v2 .olay-ic h2 { color: #f0c873; text-shadow: 2px 2px 0 #000; letter-spacing: .5px; }
.v2 .anlat { background: #e3d6b6; color: #3b2a1e; border: 0; box-shadow: none; clip-path: polygon(0 1%, 3% 0, 22% 1.5%, 48% 0, 73% 1.2%, 100% 0, 99.4% 50%, 100% 100%, 76% 98.6%, 51% 100%, 24% 98.8%, 0 100%, .6% 50%); filter: drop-shadow(0 3px 0 rgba(0,0,0,.6)); padding-top: 18px; }
.v2 .anlat .kim { top: 4px; left: 10px; background: none; border: 0; color: #8a4a2a; padding: 0; font-size: 10px; letter-spacing: 1px; }
.v2 .anlat b { color: #8a1a2a; }
/* harita */
.v2 .harita-ust { background: var(--tas), #2c2633; background-size: 96px; image-rendering: pixelated; border-bottom: 0; box-shadow: inset 0 -2px 0 var(--pirinc3), inset 0 -4px 0 var(--pirinc), 0 2px 0 #000; }
.v2 .harita-ust h2 { color: #f0c873; text-shadow: 2px 2px 0 #000; }
.v2 .harita-kay { background: radial-gradient(ellipse at 50% 0%, rgba(240,200,115,.10), transparent 55%), radial-gradient(ellipse at 50% 100%, rgba(180,32,58,.12), transparent 60%), linear-gradient(rgba(10,8,14,.55), rgba(10,8,14,.75)), var(--tas), #1a1520; background-size: auto, auto, auto, 96px; image-rendering: pixelated; }
.v2 .dugum { background: radial-gradient(circle at 40% 35%, #463f4e, #1d1822 70%); border: 2px solid #000; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--pirinc3), 0 3px 0 #000; }
.v2 .dugum.acik { box-shadow: inset 0 0 0 2px var(--pirinc2), 0 0 12px rgba(240,200,115,.55), 0 3px 0 #000; background: radial-gradient(circle at 40% 35%, #5a4f5e, #2c2633 70%); }
.v2 .dugum.burada { box-shadow: inset 0 0 0 2px #fff, 0 0 14px rgba(255,255,255,.4); }
.v2 .dugum.boss { border-radius: 8px; background: radial-gradient(circle at 50% 40%, #6e1226, #2a0d14 75%); box-shadow: inset 0 0 0 2px #e04a5a, 0 0 18px rgba(224,74,90,.5), 0 3px 0 #000; }
.v2 .efsane { background: var(--tas), #2c2633; background-size: 96px; image-rendering: pixelated; border-top: 0; box-shadow: inset 0 2px 0 var(--pirinc3), inset 0 4px 0 var(--pirinc); color: #c9bfd6; text-shadow: 1px 1px 0 #000; }
/* ödül ve seviye */
.v2 .odul { background: radial-gradient(ellipse at 50% 20%, rgba(240,200,115,.12), transparent 60%), linear-gradient(rgba(14,11,19,.7), rgba(14,11,19,.9)), var(--tas), #1a1520; background-size: auto, auto, 96px; image-rendering: pixelated; }
.v2 .odul h2 { color: #f0c873; text-shadow: 0 2px 0 #5a3d1a, 0 4px 0 #000; }
.v2 .odul .kart, .v2 .mpanel .kart { background: var(--tas), #2c2633; background-size: 96px; image-rendering: pixelated; box-shadow: inset 0 0 0 2px var(--kc), inset 0 0 0 4px #000; }
.v2 .odul .kart .res, .v2 .mpanel .kart .res { width: calc(100% - 8px); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--kc) 45%, #000), #0c0910 75%); border: 2px solid #000; box-shadow: inset 0 0 0 1px var(--pirinc3); }
.v2 .odul .kart .ad, .v2 .mpanel .kart .ad { background: #e3d6b6; color: #2a1a10; width: calc(100% - 6px); justify-content: center; padding: 1px 2px; border: 2px solid #000; }
.v2 .odul .kart .acik, .v2 .mpanel .kart .acik { color: #e3d6b6; }
.v2 .odul .kart .mal, .v2 .mpanel .kart .mal { background: radial-gradient(circle at 35% 30%, #9fc0ff, #3a5296 50%, #1f2f5c); box-shadow: 0 0 0 2px var(--pirinc); }
.v2 .odul .kart:hover, .v2 .odul .kart:active { transform: translateY(-4px); box-shadow: inset 0 0 0 2px var(--pirinc2), inset 0 0 0 4px #000, 0 0 14px rgba(240,200,115,.5); }
.v2 .odul .kart { animation: kartGel .4s ease-out backwards; }
.v2 .odul .kart:nth-child(2) { animation-delay: .08s; } .v2 .odul .kart:nth-child(3) { animation-delay: .16s; } .v2 .odul .kart:nth-child(4) { animation-delay: .24s; }
@keyframes kartGel { from { opacity: 0; transform: translateY(24px) rotate(-4deg) scale(.9); } }
.v2 .yt, .v2 .satir { background: var(--tas), #2c2633; background-size: 96px; image-rendering: pixelated; border: 2px solid #000; box-shadow: inset 0 0 0 2px var(--pirinc3); }

.v2 .yt .m { color: #f0c873; }

.v2 .mpanel h2 { color: #f0c873; text-shadow: 2px 2px 0 #000; }
.v2 .mpanel h3 { color: #c9b8e8; }
.v2 .tst { background: #1a1520; border: 2px solid #000; box-shadow: inset 0 0 0 2px var(--pirinc), 0 3px 0 rgba(0,0,0,.5); color: #efe8d8; }
/* zar kutusu taş */
.v2 .zar-kutu .bas { color: #d6c8a6; }
.v2 .zar-kutu .form { color: #efe8d8; }

/* ---- omuz üstü kamera ---- */
.v2s .bg-kutu { position: absolute; z-index: 0; }
.v2s .bg-kutu canvas.bg2 { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.v2s .dusmanlar { top: auto; right: 6px; align-items: flex-end; justify-content: space-around; padding: 0; z-index: 2; }
.v2s .dusman { justify-content: flex-end; }

function el(tag, cls, html) {

// Tohumlu rastgelelik (mulberry32), durumu kaydedilebilir
class RNG {
  constructor(s) { this.s = s >>> 0; }
  next() {
    let a = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  weighted(pairs) { // [[val, w], ...]
    const tot = pairs.reduce((s, p) => s + p[1], 0);
    let r = this.next() * tot;
    for (const p of pairs) { if ((r -= p[1]) < 0) return p[0]; }
    return pairs[pairs.length - 1][0];
  }
}

const SWAPS = {
  sican: { c: 'n', C: 'N', W: 'B', E: 'D' },
  fosfor: { O: 'H', o: 'g', y: 'y' },
  feather: { S: 'M' },

// Pixel haritasını canvas'a çiz
function drawMap(ctx, map, ox = 0, oy = 0, swap) {
  for (let y = 0; y < map.length; y++) {
    const row = map[y];
    for (let x = 0; x < row.length; x++) {
      let ch = row[x];
      if (ch === '.' || ch === ' ') continue;
      if (swap && swap[ch]) ch = swap[ch];
      const col = PAL[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(ox + x, oy + y, 1, 1);
    }
  }
}
function mapSize(map) { return { w: Math.max(...map.map(r => r.length)), h: map.length }; }

const _sprCache = {};
// Sprite'tan ölçekli <canvas> üret
function spriteCanvas(name, scale = 3, swap, flip) {
  const key = name + '|' + scale + '|' + JSON.stringify(swap || '') + '|' + (flip ? 1 : 0);
  const map = SPR[name];
  const { w, h } = mapSize(map);
  let base = _sprCache[key];
  if (!base) {
    base = document.createElement('canvas');
    base.width = w; base.height = h;
    const c = base.getContext('2d');
    drawMap(c, map, 0, 0, swap);
    if (flip) {
      const t = document.createElement('canvas'); t.width = w; t.height = h;
      const tc = t.getContext('2d'); tc.translate(w, 0); tc.scale(-1, 1); tc.drawImage(base, 0, 0);
      base = t;
    }
    _sprCache[key] = base;
  }
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(base, 0, 0);
  cv.className = 'px';
  cv.style.width = (w * scale) + 'px';
  cv.style.height = (h * scale) + 'px';
  return cv;
}
// HTML içine yer tutucu; hydrateIcons ile çizilir
function iconHTML(name, scale = 2, swap) {
  const { w, h } = mapSize(SPR[name]);
  return '<span class="icow"><canvas class="px ico" data-spr="' + name + '"' +
    (swap ? ' data-sw="' + encodeURIComponent(JSON.stringify(swap)) + '"' : '') +
    ' style="width:' + w * scale + 'px;height:' + h * scale + 'px"></canvas></span>';
}
// outerHTML ile kaybolan canvas içeriğini yeniden çiz
function hydrateIcons(root) {
  $$('canvas[data-spr]', root).forEach(cv => {
    if (cv.dataset.done) return;
    const swap = cv.dataset.sw ? JSON.parse(decodeURIComponent(cv.dataset.sw)) : undefined;
    const map = SPR[cv.dataset.spr];
    const { w, h } = mapSize(map);
    cv.width = w; cv.height = h;
    drawMap(cv.getContext('2d'), map, 0, 0, swap);
    cv.dataset.done = '1';
  });
}

// Sar + kılıç (pala ya da Yatağan-ı Ebsar), gözlerin durumu ile
function sarCanvas(scale, opts = {}) {
  const W = 40, H = 33;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  drawMap(c, SPR.sar, 0, 1);
  // kılıç katmanı
  const L = document.createElement('canvas'); L.width = W; L.height = H;
  const lc = L.getContext('2d');
  const put = (x, y, ch) => { lc.fillStyle = PAL[ch]; lc.fillRect(x, y, 1, 1); };
  put(23, 23, 'N'); put(24, 23, 'N'); put(24, 22, 'D');
  put(25, 22, 'Y'); put(26, 23, 'Y'); put(24, 21, 'Y');
  const blade = [[26, 21], [27, 20], [28, 19], [29, 18], [30, 17], [31, 16], [32, 15], [33, 13], [34, 12], [35, 10], [36, 9], [36, 8], [37, 7]];
  const ebsar = !!opts.ebsar;
  blade.forEach(([x, y], i) => {
    put(x, y, ebsar ? 'm' : 'c');
    if (i < blade.length - 2) put(x, y + 1, ebsar ? 'S' : 'C');
  });
  if (ebsar) {
    // gözler: 0 kapalı, 1 mavi, 2 kızıl
    const eyes = opts.eyes || [0, 0, 0];
    const pos = [[28, 19], [31, 16], [34, 12]];
    pos.forEach(([x, y], i) => {
      const st = eyes[i] || 0;
      put(x, y, st === 0 ? 'C' : st === 1 ? 'p' : 'O');
      if (st) put(x, y + 1, st === 1 ? 'P' : 'B');
    });
  }
  // dış hat
  const img = lc.getImageData(0, 0, W, H).data;
  const filled = (x, y) => x >= 0 && y >= 0 && x < W && y < H && img[(y * W + x) * 4 + 3] > 0;
  lc.fillStyle = PAL.K;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (filled(x, y)) continue;
    if (filled(x + 1, y) || filled(x - 1, y) || filled(x, y + 1) || filled(x, y - 1)) {
      const sp = c.getImageData(x, y, 1, 1).data;
      if (sp[3] === 0) lc.fillRect(x, y, 1, 1);
    }
  }
  c.drawImage(L, 0, 0);
  // inci lekesi (sol kolda pas kırmızısı)
  if (opts.leke) { c.fillStyle = PAL.R; c.fillRect(7, 23, 2, 1); c.fillRect(7, 24, 1, 1); }
  cv.className = 'px';
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  return cv;
}

// ===== Arka planlar (yordamsal) =====
function bgCanvas(kind, w = 180, h = 110) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  const R = new RNG(kind.length * 7919 + 13);
  const px = (x, y, col, ww = 1, hh = 1) => { c.fillStyle = col; c.fillRect(x | 0, y | 0, ww, hh); };
  const sky = (top, bot) => {
    const steps = 6;
    for (let i = 0; i < steps; i++) {
      c.fillStyle = i < steps / 2 ? top : bot;
      c.globalAlpha = 1;
      c.fillRect(0, (i * h) / steps, w, h / steps + 1);
    }
  };
  if (kind === 'kutuphane') {
    px(0, 0, '#1a1424', w, h);
    // kemerler
    for (let i = 0; i < 4; i++) {
      const x0 = i * 46 + 4;
      px(x0, 8, '#241b30', 40, h - 8);
      for (let a = 0; a < 20; a++) { const yy = 8 + Math.round(10 - Math.sqrt(Math.max(0, 100 - (a - 10) * (a - 10)))); px(x0 + a * 2, yy - 2, '#2e2440', 2, 2); }
      // raflar
      for (let s = 0; s < 5; s++) {
        const y = 24 + s * 16;
        px(x0, y + 12, '#4a3220', 40, 2);
        let x = x0 + 1;
        while (x < x0 + 38) {
          const bw = R.int(2, 4), bh = R.int(7, 11);
          const col = R.pick(['#7a2a24', '#2a4a7a', '#2b7a64', '#8a6a2a', '#5a3a6a', '#3a3a44', '#9a7a4a']);
          px(x, y + 12 - bh, col, bw, bh);
          px(x, y + 12 - bh + 2, 'rgba(255,230,160,0.25)', bw, 1);
          x += bw + (R.next() < 0.2 ? 1 : 0);
        }
      }
    }
    // mum ışıkları
    for (let i = 0; i < 6; i++) { const x = R.int(10, w - 10), y = R.int(20, 60); px(x - 3, y - 3, 'rgba(244,210,122,0.08)', 7, 7); px(x, y, '#f4d27a'); px(x, y + 1, '#e6e0d2'); }
    px(0, h - 10, '#120e1a', w, 10);
    for (let x = 0; x < w; x += 8) px(x, h - 10, '#241b30', 4, 1);
  } else if (kind === 'sarnic') {
    px(0, 0, '#0e1420', w, h);
    for (let i = 0; i < 6; i++) {
      const x0 = i * 32 - 4;
      px(x0 + 12, 20, '#1d2638', 8, 60);
      px(x0 + 13, 20, '#2a3650', 2, 60);
      for (let a = 0; a <= 16; a++) { const yy = 20 - Math.round(Math.sqrt(Math.max(0, 64 - (a - 8) * (a - 8)))); px(x0 + 16 + a, yy, '#2a3650', 1, 2); }
    }
    for (let y = 80; y < h; y++) for (let x = 0; x < w; x += 2) if (R.next() < 0.5) px(x, y, R.next() < 0.5 ? '#16243a' : '#1d2f4a', 2, 1);
    for (let i = 0; i < 30; i++) px(R.int(0, w), R.int(82, h), '#3a5296');
    for (let i = 0; i < 8; i++) px(R.int(0, w), R.int(0, 75), '#2b9c94');
  } else if (kind === 'sokak' || kind === 'kapi' || kind === 'baslik') {
    // gece göğü bantları
    const bands = ['#120e22', '#16112a', '#1b1530', '#211838', '#2a1c3c', '#36203e'];
    bands.forEach((b, i) => px(0, i * (h * 0.11), b, w, h * 0.11 + 1));
    px(0, h * 0.66, '#36203e', w, h);
    for (let i = 0; i < 40; i++) px(R.int(0, w), R.int(0, h * 0.5), R.next() < 0.3 ? '#e6e0d2' : '#8a84a4');
    // çift ay
    const moon = (mx, my, r, col, shade) => {
      for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r) px(mx + x, my + y, (x + y > r * 0.6) ? shade : col);
    };
    moon(w * 0.72, 22, 11, '#c8c1da', '#a69ec0');
    moon(w * 0.86, 34, 5, '#b4203a', '#7a1428');
    // şehir silueti
    let x = 0;
    while (x < w) {
      const bw = R.int(10, 22), bh = R.int(18, 40);
      const y0 = h - bh;
      px(x, y0, '#0f0b18', bw, bh);
      if (R.next() < 0.45) { // kubbe
        const r = Math.floor(bw / 2) - 1;
        for (let yy = 0; yy <= r; yy++) { const ww = Math.round(Math.sqrt(r * r - yy * yy)); px(x + bw / 2 - ww, y0 - yy, '#0f0b18', ww * 2, 1); }
        px(x + bw / 2, y0 - r - 3, '#0f0b18', 1, 3);
      }
      if (R.next() < 0.25) { px(x + 2, y0 - 22, '#0f0b18', 3, 22); px(x + 1, y0 - 22, '#0f0b18', 5, 2); px(x + 3, y0 - 26, '#0f0b18', 1, 4); }
      for (let k = 0; k < 3; k++) if (R.next() < 0.5) px(x + R.int(2, bw - 3), y0 + R.int(4, bh - 4), '#dfa52a', 1, 2);
      x += bw;
    }
    if (kind !== 'baslik') { // saraydan duman
      for (let i = 0; i < 40; i++) { const t = i / 40; px(30 + Math.sin(t * 9) * 6 + t * 20, h - 40 - t * 70, 'rgba(60,50,70,0.8)', 4, 4); }
    }
    if (kind === 'kapi') {
      px(w / 2 - 34, 30, '#2a1f2e', 68, h - 30);
      for (let a = 0; a <= 40; a++) { const yy = 46 - Math.round(Math.sqrt(Math.max(0, 400 - (a - 20) * (a - 20)))); px(w / 2 - 20 + a, yy, '#0a0710', 1, h - yy); }
      px(w / 2 - 34, 28, '#4a3a4e', 68, 3);
      [[w / 2 - 28, 56], [w / 2 + 26, 56]].forEach(([tx, ty]) => { px(tx - 1, ty, '#6b4a2f', 2, 8); px(tx - 2, ty - 4, '#ea4a26', 4, 4); px(tx - 1, ty - 6, '#ff9a3c', 2, 2); });
    }
  } else if (kind === 'oda') {
    px(0, 0, '#1c1428', w, h);
    px(0, h * 0.62, '#2a1f30', w, h);
    for (let x = 0; x < w; x += 12) for (let y = 0; y < h * 0.6; y += 12) { px(x + 4, y + 4, '#241a33', 4, 4); px(x + 5, y + 5, '#2b9c94', 2, 2); }
    px(w * 0.5 - 30, h * 0.48, '#4a3220', 60, 6);
    px(w * 0.5 - 26, h * 0.48 + 6, '#3b2a1e', 4, 20); px(w * 0.5 + 22, h * 0.48 + 6, '#3b2a1e', 4, 20);
    px(w * 0.5 - 20, h * 0.48 - 2, '#e6e0d2', 26, 2);
    px(w * 0.5 + 10, h * 0.48 - 6, '#f4d27a', 2, 4);
  }
  cv.className = 'px bg';
  return cv;
}

// ===== Ses: Web Audio ile chiptune Hicaz =====
const AU = {
  ctx: null, master: null, mus: null, fx: null,
  musicOn: load('nebru_music', true), sfxOn: load('nebru_sfx', true),
  track: null, timer: null, step: 0, nextT: 0
};
function auInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    AU.ctx = new Ctx();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = 0.6; AU.master.connect(AU.ctx.destination);
    AU.mus = AU.ctx.createGain(); AU.mus.gain.value = AU.musicOn ? 0.16 : 0; AU.mus.connect(AU.master);
    AU.fx = AU.ctx.createGain(); AU.fx.gain.value = AU.sfxOn ? 0.45 : 0; AU.fx.connect(AU.master);
    const len = AU.ctx.sampleRate * 0.5;
    AU.noise = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
    const d = AU.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AU.ctx = null; }
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(dest, t, freq, dur, type = 'square', vol = 0.3, slide) {
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
function noiseHit(dest, t, dur, vol = 0.3, hp = 800) {
  const s = AU.ctx.createBufferSource(); s.buffer = AU.noise;
  const f = AU.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = AU.ctx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + 0.02);
}


// Filtreli gürültü (frekans süpürmeli)
function nz(dest, t, dur, vol, type, f0, f1, Q = 1, att = 0.004) {
  const s = AU.ctx.createBufferSource(); s.buffer = AU.noise; s.loop = true;
  const f = AU.ctx.createBiquadFilter(); f.type = type; f.Q.value = Q;
  f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AU.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.05);
}
// Metal çınlaması: inharmonik kısmi sesler
function ring(dest, t, f0, ratios, dur, vol) {
  ratios.forEach((r, i) => {
    const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
    o.type = i === 0 ? 'triangle' : 'sine';
    o.frequency.setValueAtTime(f0 * r * (1 + (Math.random() - 0.5) * 0.01), t);
    const d = dur / (1 + i * 0.6), v = vol / (1 + i * 0.7);

// Kısa yankı (taş salon hissi)
function yanki() {
  if (AU.verb) return AU.verb;
  const d = AU.ctx.createDelay(0.5); d.delayTime.value = 0.085;
  const fb = AU.ctx.createGain(); fb.gain.value = 0.32;
  const lp = AU.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  const out = AU.ctx.createGain(); out.gain.value = 0.35;
  d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(out); out.connect(AU.fx);
  const inp = AU.ctx.createGain(); inp.connect(AU.fx); inp.connect(d);
  return (AU.verb = inp);
}
function thump(dest, t, f0, f1, dur, vol) { tone(dest, t, f0, dur, 'sine', vol, f1); }

function playTrack(name) {
  if (!AU.ctx) return;
  if (AU.track === name) return;
  AU.track = name; AU.step = 0; AU.nextT = AU.ctx.currentTime + 0.05;
  if (AU.timer) clearInterval(AU.timer);
  if (!name) return;
  AU.timer = setInterval(schedule, 30);
}
function schedule() {
  const tr = TRACKS[AU.track];
  if (!tr || !AU.ctx) return;
  while (AU.nextT < AU.ctx.currentTime + 0.15) {
    const i = AU.step;
    const n = tr.lead[i % tr.lead.length];
    if (n) {
      // süreyi bir sonraki notaya kadar uzat
      let len = 1; while (len < 4 && tr.lead[(i + len) % tr.lead.length] === null) len++;
      tone(AU.mus, AU.nextT, mtof(n), tr.step * len * 0.92, tr.dalga || 'square', 0.22);
      tone(AU.mus, AU.nextT, mtof(n) * 1.006, tr.step * len * 0.8, 'square', 0.06); // hafif koro
    }
    const b = tr.bass[i % tr.bass.length];
    if (b) tone(AU.mus, AU.nextT, mtof(b), tr.step * 1.8, 'triangle', 0.5);
    const d = tr.drum[i % tr.drum.length];
    if (d === 'd') { if (Math.random() < 0.5) tone(AU.mus, AU.nextT, 1500 + Math.random() * 700, 0.08, 'sine', 0.25, 800); }
    else if (d === 'k') { tone(AU.mus, AU.nextT, 220, 0.05, 'triangle', 0.4, 120); }
    else if (d === 'D') { tone(AU.mus, AU.nextT, 120, 0.12, 'sine', 0.7, 45); }
    else if (d === 't') { noiseHit(AU.mus, AU.nextT, 0.05, 0.25, 3000); }
    AU.nextT += tr.step; AU.step++;
  }
}

// ===== Oyun durumu, kayıt, harita =====
let G = null;     // run durumu
let C = null;     // savaş durumu
let RNGm = null;  // harita/ödül rastgeleliği
let RNGd = null;  // zar rastgeleliği
const SAVE_KEY = 'nebru_run_v1';
const DEFTER_KEY = 'nebru_defter_v1';
const OPTS = Object.assign({ hizli: false }, load('nebru_opts', {}));
const FLOORS = 9, COLS = 4;

function newRun(seed) {
  seed = (seed >>> 0) || ((Date.now() ^ (Math.random() * 1e9)) >>> 0);
  RNGm = new RNG(seed); RNGd = new RNG(seed ^ 0x9e3779b9);
  G = {
    v: 1, seed, hp: 72, maxHp: 72, gold: 60, lvl: 1,
    stats: { KUV: 8, CEV: 14, DAY: 12, MAL: 16, BAS: 12, KEL: 12 },
    deck: START_DECK.map(id => ({ id, u: false })),
    relics: ['sorguc'], feats: [], nizam: 0, ates: 0,
    ebsar: false, eyes: [0, 0, 0], silah: 'saray_pala', zirh: 'kaftan', silahlar: ['saray_pala'], zirhlar: ['kaftan'], perde: 1, tuz: 3, husnam: 2, removeCost: 75,
    pos: null, map: genMap(), seen: [], seenS: [], basla: {}, killedTypes: [],
    stat: { olum: 0, kritik: 0, bir: 0, hasar: 0, savas: 0 },
    scene: 'intro', introStep: 0, pending: null, kutuphane: null, asmarel: null
  };
  saveRun();
}
function saveRun() {
  if (!G) return;
  G.rngM = RNGm.s; G.rngD = RNGd.s;
  store(SAVE_KEY, G);
}
function loadRun() {
  const g = load(SAVE_KEY, null);
  if (!g || g.v !== 1) return false;
  G = g; RNGm = new RNG(G.rngM); RNGd = new RNG(G.rngD);
  if (!G.silah) { G.silah = G.ebsar ? 'ebsar' : 'saray_pala'; G.zirh = 'kaftan'; G.silahlar = [G.silah]; G.zirhlar = ['kaftan']; }
  if (!G.perde) G.perde = 1;
  if (G.map && G.map.baslik && G.perde >= 2 && !G.yurt) G.map.sablon = true;
  if (G.map && G.map.rows && !G.map.floors && !G.yurt) { G.map.floors = G.map.rows.length; G.map.cols = Math.max(...G.map.rows.map(r => r.length)); }
  return true;
}
function hasSave() { const g = load(SAVE_KEY, null); return !!(g && g.v === 1 && g.scene !== 'bitti'); }
function clearRun() { unstore(SAVE_KEY); }

function defter() { return load(DEFTER_KEY, { gorulen: [], runs: 0, zafer: 0 }); }
function defterYaz(f) { const d = defter(); f(d); store(DEFTER_KEY, d); }
function defterGor(id) { defterYaz(d => { if (!d.gorulen.includes(id)) d.gorulen.push(id); }); }

// ----- Yardımcı hesaplar -----
const prof = () => (G.lvl >= 7 ? 4 : G.lvl >= 4 ? 3 : 2);
const smod = k => mod(G.stats[k]);
const hasRelic = id => G.relics.includes(id);
const hasFeat = id => G.feats.includes(id);
function saveDC(stat) { return 8 + prof() + smod(stat); }

// ----- Harita üretimi -----
function genMap() {
  const R = RNGm;
  const rows = Array.from({ length: FLOORS }, () => Array(COLS).fill(null));
  const ensure = (f, c) => rows[f][c] || (rows[f][c] = { f, c, t: null, nx: [], jx: R.int(-8, 8), jy: R.int(-6, 6) });
  const starts = R.shuffle([0, 1, 2, 3]).slice(0, 3);
  starts.push(R.int(0, 3));
  for (const s of starts) {
    let c = s;
    ensure(0, c);
    for (let f = 0; f < FLOORS - 1; f++) {
      let nc = clamp(c + R.int(-1, 1), 0, COLS - 1);
      const a = ensure(f, c); ensure(f + 1, nc);
      if (!a.nx.includes(nc)) a.nx.push(nc);
      c = nc;
    }
  }
  // türler
  const all = [];
  rows.forEach(r => r.forEach(n => n && all.push(n)));
  for (const n of all) {
    if (n.f === 0) n.t = 'savas';
    else if (n.f === FLOORS - 1) n.t = 'ocak';
    else if (n.f === 5) n.t = 'hazine';
    else {
      const w = n.f <= 2 ? [['savas', 26], ['olay', 24], ['sinav', 26], ['mabet', 6]] : [['savas', 40], ['olay', 20], ['sinav', 12], ['mabet', 6]];
      if (n.f >= 2) w.push(['silahhane', 7]);
      if (n.f >= 3) w.push(['elit', 12]);
      if (n.f >= 2) w.push(['pazar', 8]);
      if (n.f >= 3 && n.f !== FLOORS - 2) w.push(['ocak', 10]);
      n.t = R.weighted(w);
    }
  }
  const count = t => all.filter(n => n.t === t).length;
  let guard = 0;
  while (count('elit') < 2 && guard++ < 50) {
    const cand = all.filter(n => n.t === 'savas' && n.f >= 3 && n.f <= 7);
    if (!cand.length) break; R.pick(cand).t = 'elit';
  }
  for (const [t, f0, f1] of [['silahhane', 2, 6], ['mabet', 1, 7]]) if (count(t) < 1) { const cand = all.filter(n => (n.t === 'savas' || n.t === 'olay') && n.f >= f0 && n.f <= f1); if (cand.length) R.pick(cand).t = t; }
  if (count('pazar') < 1) {
    const cand = all.filter(n => (n.t === 'savas' || n.t === 'olay') && n.f >= 3 && n.f <= 6);
    if (cand.length) R.pick(cand).t = 'pazar';
  }
  rows.forEach(r => r.forEach(n => n && n.nx.sort()));
  return { rows, floors: FLOORS, cols: COLS };
}
function nodeAt(f, c) { return G.map.rows[f] && G.map.rows[f][c]; }
const mapF = () => (G && G.map && G.map.floors) || FLOORS;
const mapC = () => (G && G.map && G.map.cols) || COLS;
function availableNodes() {
  if (!G.pos) return G.map.rows[0].filter(Boolean);
  if (G.pos.f === mapF() - 1) return G.map.boss === null ? [] : ['boss'];
  const cur = nodeAt(G.pos.f, G.pos.c);
  return cur.nx.map(c => nodeAt(G.pos.f + 1, c));
}

function addCard(id, u = false) {
  G.deck.push({ id, u });
  const d = CARDS[id];
  if (d.onPick) d.onPick();
  toast(`${d.ad}${u ? '+' : ''} destene eklendi`);
}
function gainRelic(id) {
  if (!id) { gainGold(50); return; }
  if (hasRelic(id)) { gainGold(50); return; }
  G.relics.push(id);
  if (id === 'tuzbatak') { G.maxHp += 8; G.hp += 8; }
  toast(`Emanet: ${RELICS[id].ad}`);
  sfx('para');
}
function relicPool() { return (G && G.perde >= 2 && typeof RELIC_POOL_23 !== 'undefined') ? RELIC_POOL_23[G.perde] : RELIC_POOL; }
function randomRelic() {
  const left = relicPool().filter(r => !hasRelic(r));
  return left.length ? RNGm.pick(left) : null;
}
function gainGold(n) {
  if (hasRelic('kese') && n > 0) n = Math.round(n * 1.25);
  G.gold += n; sfx('para'); toast(`+${n} Kopur`);
}
function hurt(n) { G.hp = Math.max(1, G.hp - n); sfx('acı'); toast(`−${n} can`); }
function healP(n) { const b = G.hp; G.hp = Math.min(G.maxHp, G.hp + n); if (G.hp > b) toast(`+${G.hp - b} can`); }
function upgradeRandom(n) {
  const can = G.deck.map((c, i) => i).filter(i => !G.deck[i].u);
  RNGm.shuffle(can).slice(0, n).forEach(i => { G.deck[i].u = true; toast(`${CARDS[G.deck[i].id].ad} yükseltildi`); });
}

function enterNode(n) {

  const cards = [...pick('yaygin', 3).map(id => ({ id, price: RNGm.int(45, 58) })), ...pick('nadir', 1).map(id => ({ id, price: RNGm.int(75, 90) })), ...pick('efsane', 1).map(id => ({ id, price: RNGm.int(140, 160) }))];
  const rl = RNGm.shuffle(relicPool().filter(r => !hasRelic(r))).slice(0, 2).map(id => ({ id, price: RNGm.int(150, 220) }));
  return { cards, relics: rl };

const ILAH_HAVUZ = {
  1: ['tirnavull', 'komaytar', 'sehilah', 'akrebgan', 'arras', 'gulgezen', 'verruhail'],
  2: ['arras', 'sehilah', 'tirnavull', 'akrebgan', 'komaytar', 'gulgezen', 'verruhail'],
  3: ['gulgezen', 'verruhail', 'sehilah', 'akrebgan', 'komaytar', 'tirnavull', 'arras']
};
function ilahSec(f, sabit) {
  if (sabit) return sabit;
  G.mabetler = G.mabetler || [];
  if ((G.perde >= 3 || (f || 0) >= 8) && !hasRelic('engerek_pulu') && RNGm.next() < 0.06) return 'koloboros';
  const havuz = ILAH_HAVUZ[G.perde || 1].filter(x => !G.mabetler.includes(x));
  const id = havuz.length ? RNGm.pick(havuz) : RNGm.pick(ILAH_HAVUZ[G.perde || 1]);
  G.mabetler.push(id);
  return id;
}
function uyum(I) {
  const d = G.nizam - G.ates;
  if (I.sever === 'nizam') return clamp(d, -2, 3);
  if (I.sever === 'ates') return clamp(-d, -2, 3);
  if (I.sever === 'denge') return Math.abs(d) <= 1 ? 2 : -1;
  return 0;
}
const ILAH_STAT = { tirnavull: 'DAY', akrebgan: 'DAY', arras: 'BAS', gulgezen: 'KEL', komaytar: 'MAL', sehilah: 'KUV', verruhail: 'CEV' };
function kucukLutuf(id) {
  const st = ILAH_STAT[id] || 'BAS';
  const R = RNGm.int(0, 3);
  if (R === 0 && G.stats[st] < 20) { G.stats[st]++; return `${STAT_AD[st]} +1.`; }
  if (R === 1) { healP(15); return '15 can.'; }
  if (R === 2 && G.deck.some(c => !c.u)) { const c = RNGm.pick(G.deck.filter(c => !c.u)); c.u = true; return `${CARDS[c.id].ad} kendiliğinden yükseldi.`; }
  gainGold(40); return '40 Kopur, sunağın dibinden.';
}
function renderMabet() {
  playTrack(bolgeParca());
  const p = G.pending, I = ILAHLAR[p.ilah];
  if (p.sonuc) return mabetSonuc();
  const bt = [];
  const sun = (ad, bonus, fn) => bt.push({ html: ad, fn: async () => { if (fn && (await fn()) === false) return; lutufAt(bonus); } });
  if (p.ilah === 'koloboros') {
    bt.push({ html: 'Geri bak', ana: true, fn: () => { gainRelic('engerek_pulu'); p.sonuc = { t: 'Bakışını kaçırmadın. O da kaçırmadı. Göz kapandığında avucunda sıcak, kızıl bir pul vardı.', kim: 'KOLOBOROS' }; saveRun(); mabetSonuc(); } });
  } else if (p.ilah === 'gulgezen') {
    bt.push({ html: 'İstemediklerini say', ana: true, fn: () => gulgezenAkdi() });
  } else {
    I.adak.forEach(a => {
      if (a === 'kopur') { if (G.gold >= 30) sun('30 Kopur sun<small>Lütuf zarına +1</small>', 1, () => { G.gold -= 30; }); if (G.gold >= 80) sun('80 Kopur sun<small>Lütuf zarına +3</small>', 3, () => { G.gold -= 80; }); }
      if (a === 'can') { sun('Kanını sun (−6 can)<small>Lütuf zarına +2</small>', 2, () => { hurt(6); }); if (G.hp > 15) sun('Avucunu derin kes (−12 can)<small>Lütuf zarına +4</small>', 4, () => { hurt(12); }); }
      if (a === 'kart') sun('Destenden bir kart sun<small>Kart yok olur · Lütuf zarına +3</small>', 3, async () => { const i = await chooseDeckCard('Sunulacak kart', () => true); if (i == null) return false; const c = G.deck.splice(i, 1)[0]; toast(CARDS[c.id].ad + ' sunuldu'); });
      if (a === 'emanet') { const ems = G.relics.filter(r => r !== 'tuz'); if (ems.length) sun('Bir emanet sun<small>Lütuf zarına +5</small>', 5, async () => { const i = await secimModal('Sunulacak emanet', ems.map(r => RELICS[r])); if (i == null) return false; G.relics = G.relics.filter(r => r !== ems[i]); toast(RELICS[ems[i]].ad + ' sunuldu'); }); }
      if (a === 'hic') bt.push({ html: 'Hiçbir şey isteme<small>Kefeleri boş bırak</small>', ana: true, fn: () => arrasSessiz() });
    });
    if (p.ilah === 'arras' && G.gold >= 30) { /* Arras'a Kopur sunmak bir sınavdır */ }
  }
  bt.push({ html: 'Dua etmeden ayrıl', fn: () => completeNode() });
  storyScreen({ bg: 'mabet', title: `${I.ad} Mabedi`, kim: (I.unvan || '').toLocaleUpperCase('tr'), text: `${I.t}<br><br><i>${I.ses[0]}</i>`, buttons: bt });
}
async function lutufAt(adak) {

  if (p.ilah === 'arras') { p.sonuc = { t: 'Kopurlar sunağa düştü ve sesi bile çıkmadı. Rüzgâr dindi. Arras bir şey istediğin için sana bir şey vermedi; ama hiç değilse ne istediğini öğrendin.', kim: 'ARRAS' }; G.nizam += 1; saveRun(); return mabetSonuc(); }
  const u = uyum(I);
  const r = d20(false, false);
  const tot = r.d + adak + u;
  const ok = tot >= 15;
  await showRoll({ label: `${I.ad} · Lütuf Zarı${u ? ` (uyum ${sgn(u)})` : ''}`, dice: r.dice, chosen: r.chosen, bonus: adak + u, target: 15, who: 'ARTEFAKT', verdict: r.d === 20 ? 'BÜYÜK LÜTUF' : ok ? 'LÜTUF' : tot >= 8 ? 'KÜÇÜK LÜTUF' : 'KÜSKÜN', cls: r.d === 20 ? 'altin' : ok ? 'iyi' : tot >= 8 ? 'iyi' : 'kot' });
  let t;

    const varmis = hasRelic(I.artefakt);

    t = varmis ? `Sana verebileceği şeyi zaten taşıyorsun. Yerine: ${kucukLutuf(p.ilah)}` : `<b>${RELICS[I.artefakt].ad}</b>: ${RELICS[I.artefakt].desc}`;
    if (r.d === 20 && !varmis) t += `<br>Ve fazlası: ${kucukLutuf(p.ilah)}`;
    sfx('seviye');
  } else if (tot >= 8) { t = kucukLutuf(p.ilah); sfx('para'); }
  else { hurt(5); t = 'İlah yüzünü çevirdi. Sunağın taşı kesik avucunu bir daha yardı: −5 can.'; sfx('acı'); }
  p.sonuc = { t: `<i>${I.ses[1] || I.ses[0]}</i><br><br>${t}`, kim: I.ad.toLocaleUpperCase('tr') };

}
function arrasSessiz() {
  const p = G.pending; const d = Math.abs(G.nizam - G.ates);

  if (d <= 2) { if (!hasRelic('arras_terazi')) { gainRelic('arras_terazi'); t = 'Hiçbir şey istemedin. Kefeler kımıldamadı; sonra ikisi birden hafifçe indi. Sunakta bir terazi duruyordu: <b>Arras\'ın Terazisi</b>.'; } else t = 'Hiçbir şey istemedin ve hiçbir şey almadın. İçindeki fırtına bir süre dindi. ' + kucukLutuf('arras'); }
  else { const m = Math.min(G.nizam, G.ates); G.nizam = m; G.ates = m; t = 'Kefeler boş ama sen ağırdın. Rüzgâr içindeki terazinin iki kefesini de boşalttı: Nizam ve Ateş eşitlendi. Bir dahaki sefere hafif gel.'; }

async function gulgezenSonuc() {

  if (id === 'can') { G.hp = G.maxHp; t = 'Canın doldu.'; }
  if (id === 'stat') { const k = STATS.slice().sort((a, b) => G.stats[a] - G.stats[b])[0]; G.stats[k] = Math.min(20, G.stats[k] + 2); t = `${STAT_AD[k]} +2.`; }
  if (id === 'yuksel') { RNGm.shuffle(G.deck.filter(c => !c.u)).slice(0, 2).forEach(c => (c.u = true)); t = 'İki kartın yükseldi.'; }
  if (id === 'ayna') { gainRelic('iki_yuzlu_ayna'); t = 'İki Yüzlü Ayna senin.'; }
  if (id === 'altin') { gainGold(120); t = '120 Kopur.'; }
  if (id === 'ayikla') { for (let k = 0; k < 2; k++) { const i = await chooseDeckCard('Atılacak kart', () => true); if (i != null) G.deck.splice(i, 1); } t = 'İki kart desteden çıktı.'; }
  const bedel = RNGm.int(0, 3);
  const bt = ['Azami canın 6 eksildi.', 'Kesenden 50 Kopur eksildi.', 'Terazin Ateş\'e iki adım kaydı.', 'Destene bir Siper fazladan girdi; kalabalık eder.'][bedel];
  if (bedel === 0) { G.maxHp -= 6; G.hp = Math.min(G.hp, G.maxHp); }
  if (bedel === 1) G.gold = Math.max(0, G.gold - 50);
  if (bedel === 2) G.ates += 2;
  if (bedel === 3) G.deck.push({ id: 'siper', u: false });
  p.sonuc = { t: `<i>${ILAHLAR.gulgezen.ses[1]}</i><br><br><b>Lütuf:</b> ${t}<br><b>Arka yüzü:</b> ${bt}`, kim: 'GÜLGEZEN' };
  sfx('seviye'); saveRun(); mabetSonuc();
}
function mabetSonuc() {
  const p = G.pending, I = ILAHLAR[p.ilah];
  storyScreen({ bg: 'mabet', title: `${I.ad} Mabedi`, kim: p.sonuc.kim, text: p.sonuc.t, buttons: [{ html: 'Devam', ana: true, fn: () => completeNode() }] });
}

// ---- Şablondan harita ----
function genSablon(B) {
  const cols = Math.max(...B.kat.map(k => k.length));
  const rows = B.kat.map((kat, f) => kat.map((spec, i) => Object.assign({ f, c: i, cx: i + (cols - kat.length) / 2, nx: [], jx: RNGm.int(-5, 5), jy: RNGm.int(-4, 4) }, spec)));
  rows.forEach((r, f) => { if (f < rows.length - 1) r.forEach(n => (n.nx = rows[f + 1].map((_, j) => j))); });
  return { sablon: true, rows, floors: rows.length, cols, baslik: B.baslik, alt: B.alt, sahne: B.sahne, muzik: B.muzik, gun: !!B.gun, boss: B.boss ? Object.assign({}, B.boss) : null };
}
function sablonDugum(n, p) {
  if (!G.map || !G.map.sablon) return false;
  if (n.illet && !G.illet) { G.illet = true; toast('Uyku İlleti: dinlenmeler artık tehlikeli'); }
  if (n.ev) { p.ev = n.ev; G.seen.push(n.ev); }
  if (n.enc) p.enc = n.enc;
  if (n.script) p.script = n.script;
  if (n.h) p.h = n.h;
  if (n.t === 'sinav' && n.sv) p.sv = { id: n.sv, adim: 0, ok: [], stat: [] };
  if (n.t === 'mabet') p.ilah = ilahSec(n.f, n.ilah);
  if (n.t === 'silahhane') p.stock = makeSilahStock();
  if (n.t === 'pazar') p.stock = makeStock();
  const B = BOLUMLER[G.bolum] || {};
  if (n.t === 'savas' && !n.enc) p.enc = RNGm.pick(B.savas || ENCOUNTERS.p3);
  if (n.t === 'elit' && !n.enc) p.enc = RNGm.pick(B.elit || ENCOUNTERS.p2avzor);
  if (n.t === 'olay' && !n.ev) { const h = (B.olay || []).filter(x => !G.seen.includes(x)); p.ev = h.length ? RNGm.pick(h) : RNGm.pick(B.olay || ['serap']); G.seen.push(p.ev); }
  if (n.t === 'sinav' && !n.sv) { G.seenS = G.seenS || []; const h = (B.sinav || []).filter(x => !G.seenS.includes(x)); p.sv = { id: h.length ? RNGm.pick(h) : RNGm.pick(B.sinav || ['kabak']), adim: 0, ok: [], stat: [] }; G.seenS.push(p.sv.id); }
  return true;
}
function bolumBasla(id) {
  const B = BOLUMLER[id];
  G.bolum = id; G.perde = B.perde;
  G.pos = null; G.visited = []; G.pending = null;
  if (B.hub) { yurtKur(); saveRun(); return go('yurt'); }
  G.map = genSablon(B);
  saveRun();
  if (B.giris) return baslatAkis(B.giris);
  go('harita');
}
function perdeTamam(p) {
  if (!p || (G.perde || 1) < 2) return false;
  if (p.hub) { if (p.final) { baslatAkis('p2_son'); return true; } yurtDon(p); return true; }
  const B = BOLUMLER[G.bolum]; if (!B || B.hub) return false;
  const son = p.boss || (G.map.boss === null && p.f === G.map.floors - 1);
  if (!son) return false;
  sonrakiBolum(B);
  return true;
}
function sonrakiBolum(B) {
  const sira = PERDE_SIRA[G.perde]; const i = sira.indexOf(G.bolum);
  const devam = () => (i + 1 < sira.length ? bolumBasla(sira[i + 1]) : perdeBitti(G.perde));
  if (B.kapanis) return baslatAkis(B.kapanis);
  devam();
}

  const b = C && C.enemies.find(e => e.def.boss);
  if (b && BOSS_SAHNE[b.id]) return BOSS_SAHNE[b.id];
  if (G.bolum === 'agreguk') return 'col';
  return (G.map && G.map.sahne) || 'col';
}
function savasParcasi(kind) {
  if (!G || (G.perde || 1) < 2) return kind === 'boss' ? 'boss' : 'savas';
  const b = C && C.enemies.find(e => e.def.boss);
  if (b && b.id === 'hafiye') return 'pusu';
  if (kind === 'boss') return 'boss';
  if (C && C.script === 'kongar') return 'pusu';
  return 'savas';
}
function savasAcilis(kind) {
  if (!G || (G.perde || 1) < 2) return null;
  const ids = C.enemies.map(e => e.id);
  if (ids.includes('gulbeyaban')) return 'Çift dolunay. Taş kollu bir haşere tavandan sarktı; tek gözü inciye kilitlendi.';
  if (ids.includes('hafiye')) return 'Sınır pusu! Haramiler ve gölgede bir hafiye. Belen\'in tilki postu kabardı.';
  if (ids.includes('zehrigobul')) return 'Sarı bir süt kokusu. Zehrigöbül\'ün karnı yüzlerce yavruyla kaynıyor. Kanında bir ecdat korkusu kıpırdadı.';
  if (ids.includes('gabyar')) return 'Gabyar Külhan zırhsız; pos bıyıklarının altında tiksinti. "Gözlü kılıç, ha? Ver onu bana kâtip."';
  if (ids.includes('mirzinkul')) return 'Tahtirevan devrildi. Sultan Mirzinkul ayağa kalktı; incili eli çamura değince toprak kıpırdadı.';
  if (C.script === 'kongar') return 'Gecekoynu surlarında Pullukul okçuları. Kongar baltasını kaldırdı: "Benden önce kimse ölmeyecek!"';
  if (C.script === 'duvar') return 'Lâl-i melun kaftanlı Mühredarlar bir duvar gibi dizildi. Ebsar kınında titriyor; şarkı söylemek istiyor.';
  if (ids.includes('kumkazani')) return 'Kumkazanı\'nın dişlileri döndü; cam kubbesinde zincirli bir sihirdar çığlık atıyor.';
  if (ids.includes('narkuyruk')) return 'Sarkıtlardan turuncu larvalar sarktı. Açsın. Onlar da.';
  return null;
}
function perdeKarakterEk(m) {
  if ((G.perde || 1) < 2) return;
  m.appendChild(el('h3', '', `Perde ${G.perde === 2 ? 'II' : 'III'}`));
  const sat = [];
  const ac = (k, t) => `<span class="ac-cip" data-ac="${k}">${t}</span>`;
  sat.push(ac('parilti', `İnci Parıltısı ${G.parilti || 0}/${pariltiMax()}`));
  if (G.supheAktif) sat.push(ac('suphe', `Şüphe ${G.suphe || 0}`));
  if (G.tebeddul) sat.push(ac('tebeddul', `Tebeddül ${G.tebeddul}`));
  if (G.kuf) sat.push(ac('kuf', `Küf ${G.kuf} (azami can −${G.kuf * 4})`));
  sat.push(ac('tuz', `Kırmızı Tuz ${G.tuz || 0} doz`));
  if (G.asmarelBag) sat.push(ac('bag', `Aşmarel Bağı ${G.asmarelBag}`));
  if (G.illet && !illetYok()) sat.push(ac('illet', 'Uyku İlleti etkin'));
  m.appendChild(el('p', 'ac-cipler', sat.join('')));
  const gv = ['kongar', 'lilavar', 'pamir', 'belen'].filter(id => G.guven && G.guven[id] != null && !(id === 'kongar' && G.kongarOldu));
  if (gv.length) m.appendChild(el('p', 'ac-cipler', gv.map(id => `<span class="ac-cip" data-ac="y_${id}">${YOLDAS[id].ad} ${'◆'.repeat(guven(id))}${'◇'.repeat(3 - guven(id))}</span>`).join('') + '<span class="ac-cip" data-ac="guven">Güven?</span>'));
  if (G.kendi) m.appendChild(el('p', '', `Kendi büyün: <b>${G.kendi.ad}</b> (${CARDS[G.kendi.a].ad} + ${CARDS[G.kendi.b].ad})`));
}

function d20(adv, dis) {
  if (adv && dis) { adv = dis = false; }
  const a = RNGd.int(1, 20);
  if (!adv && !dis) return { dice: [a], chosen: 0, d: a };
  const b = RNGd.int(1, 20);
  const pickA = adv ? a >= b : a <= b;
  return { dice: [a, b], chosen: pickA ? 0 : 1, d: pickA ? a : b };
}
function hitChance(bonus, ac, adv, dis, critMin = 20) {
  if (adv && dis) adv = dis = false;
  let need = ac - bonus; // d >= need
  let p = (21 - clamp(need, 2, 21)) / 20;
  p = Math.max(p, (21 - critMin) / 20);
  p = Math.min(p, 0.95);
  if (adv) return 1 - (1 - p) * (1 - p);
  if (dis) return p * p;
  return p;
}

// ---- Saldırı parametreleri ----
function atkStat(card) {
  let st = (card && card.stat) || 'CEV';
  const kilic = card && card.tur === 'kilic';
  if (kilic && C && C.hendese) st = 'MAL';
  if (kilic && silah().mod.stat && !C?.hendese) st = silah().mod.stat;
  if (kilic && hasFeat('hendese_ustasi') && smod('MAL') > smod(st)) st = 'MAL';
  return st;
}
function atkInfo(t, card, extraAdv) {
  const st = atkStat(card);
  let bonus = smod(st) + prof() + C.p.malumat + C.turAtk - (C.p.korku > 0 ? 2 : 0);
  if (hasFeat('tesrihci') && G.killedTypes.includes(t.id)) bonus += 1;
  if (card && card.tur === 'kilic' && silah().mod.isabet) bonus += silah().mod.isabet;
  let adv = !!extraAdv || C.p.odak > 0 || (goz(0) && !C.yalmanUsed) || (hasFeat('olu') && G.hp < G.maxHp * 0.25);
  let dis = C.p.aksak > 0;
  if (dis && hasFeat('aksak_ritim')) { dis = false; adv = true; }
  const ac = t.def.ac + t.acMod;
  let critMin = hasRelic('gumus') ? 19 : 20;
  if (card && card.tur === 'kilic' && silah().mod.crit) critMin = Math.min(critMin, silah().mod.crit);
  return { st, bonus, adv, dis, ac, critMin, p: hitChance(bonus, ac, adv, dis, critMin) };
}

async function attack(t, o) {
  if (!t || t.hp <= 0) return { hit: false };
  const card = o.card || { tur: 'kilic', stat: 'CEV', ad: 'Saldırı' };
  const inf = atkInfo(t, card, o.adv);
  if (o.critMin) inf.critMin = Math.min(inf.critMin, o.critMin);
  // tüketilenler
  if (C.p.odak > 0 && inf.adv) C.p.odak--;
  if (C.p.aksak > 0) C.p.aksak--;
  if (goz(0)) C.yalmanUsed = true;
  const r = d20(inf.adv, inf.dis);
  const nat20 = r.d === 20, nat1 = r.d === 1;
  const crit = r.d >= inf.critMin;
  const tot = r.d + inf.bonus;
  const hit = !nat1 && (crit || tot >= inf.ac);
  let verdict = hit ? (crit ? 'KRİTİK!' : 'İSABET') : (nat1 ? 'FELAKET' : 'ISKA');
  await showRoll({ label: `${card.ad} → ${t.ad}${inf.adv && !inf.dis ? ' · avantaj' : ''}${inf.dis && !inf.adv ? ' · dezavantaj' : ''}`, dice: r.dice, chosen: r.chosen, bonus: inf.bonus, target: inf.ac, who: 'ZS', verdict, cls: hit ? (crit ? 'altin' : 'iyi') : 'kot' });
  if (hit) {
    C.p.malumat = 0;
    let dmg = rollDice(o.die) + (crit ? rollDice(o.die) : 0);
    if (!o.noMod) dmg += smod(inf.st);
    if (card.tur === 'kilic') dmg += silahDmg() + (silah().mod.ates || 0) + (hasRelic('adak_tasi') ? 2 : 0);
    if (hasRelic('pasli') && card.tur === 'kilic') dmg += 1;
    if (hasRelic('gabyar_defteri') && (t.id === 'muhredar' || t.def.mirzinkulMuhafiz)) dmg += 2;
    if (C.ebsarBirakti && card.tur === 'kilic') dmg -= 2;
    if (crit && hasRelic('iki_yuzlu_ayna')) drawCards(1);
    if (crit && hasRelic('musvedde')) { C.ink += 1; toast('Müsvedde: +1 Mürekkep'); }
    if (C.ates && card.tur === 'kilic') { dmg += rollDice(C.ates); C.ates = null; }
    dmg = Math.max(1, dmg);
    if (crit) { G.stat.kritik++; sfx('kritik'); vibrate(70); say(fill(RNGm.pick(NARR.kritik), t)); }
    else { sfx('vur'); vibrate(20); say(fill(RNGm.pick(NARR.vur), t)); }
    if (window.FX) await FX.vurus(t, crit, card.tur);
    dmgEnemy(t, dmg, crit ? 'kritik' : '');
    if (hasRelic('semonya') && !C.semonyaUsed && t.hp > 0) { C.semonyaUsed = true; addE(t, 'kanama', 3); }
    if (card.tur === 'kilic' && t.hp > 0) { if (silah().mod.kanama) addE(t, 'kanama', silah().mod.kanama); if (crit && silah().mod.serseme) addE(t, 'serseme', 1); }
    return { hit: true, crit, dmg };
  } else {
    C.p.malumat = Math.min(5, C.p.malumat + 1);
    if (hasRelic('iki_yuzlu_ayna')) playerDmgRaw(2);
    if (nat1) {
      G.stat.bir++; sfx('bir'); say(RNGm.pick(NARR.bir));
      const m = RNGd.int(0, 2);
      if (m === 0 && C.ink > 0) { C.ink--; toast('Mürekkep döküldü: −1'); }
      else if (m === 1 && C.hand.length) { const i = RNGd.int(0, C.hand.length - 1); C.disc.push(C.hand.splice(i, 1)[0]); toast('Bir kart elinden kaydı'); }
      else { playerDmgRaw(2); toast('Kendini kestin: −2'); }
    } else { sfx('iska'); say(fill(RNGm.pick(NARR.iska), t)); if (window.FX) await FX.iska(t); }
    renderCombat();
    return { hit: false };
  }
}

// Savurma: tek d20, her düşmanın ZS'sine ayrı bakılır
async function savurma(o) {
  const card = o.card;
  const list = liveEnemies().filter(e => !(e.gizli && !e.revealed));
  if (!list.length) return;
  const infs = list.map(e => atkInfo(e, card));
  const inf = infs[0];
  if (C.p.odak > 0 && inf.adv) C.p.odak--;
  if (C.p.aksak > 0) C.p.aksak--;
  if (goz(0)) C.yalmanUsed = true;
  const r = d20(inf.adv, inf.dis);
  const hits = list.map((e, i) => r.d !== 1 && (r.d >= infs[i].critMin || r.d + inf.bonus >= infs[i].ac));
  const crit = r.d >= inf.critMin;
  const nh = hits.filter(Boolean).length;
  await showRoll({ label: `Savurma → ${list.length > 1 ? list.length + ' düşman' : list[0].ad}`, dice: r.dice, chosen: r.chosen, bonus: inf.bonus, target: infs.map(x => x.ac).join('/'), who: 'ZS', verdict: crit && nh ? 'KRİTİK SAVURMA!' : nh ? `${nh}/${list.length} İSABET` : (r.d === 1 ? 'FELAKET' : 'ISKA'), cls: nh ? (crit ? 'altin' : 'iyi') : 'kot' });
  if (!nh) {
    C.p.malumat = Math.min(5, C.p.malumat + 1);
    sfx('iska'); say('Yatağan boşluğu biçti.');
    if (window.FX) await FX.iska(list[0]);
    renderCombat(); return;
  }
  C.p.malumat = 0;
  sfx(crit ? 'kritik' : 'vur'); vibrate(crit ? 70 : 25);
  say(nh === list.length && list.length > 1 ? 'Yatağan yarım daire çizdi; hepsi geri sendeledi.' : 'Savurma hedeflerden birini yakaladı.');
  if (window.FX) await FX.savurma(list.filter((e, i) => hits[i]), crit);
  list.forEach((e, i) => {
    if (!hits[i]) return;
    let dmg = rollDice(o.die) + (crit ? rollDice(o.die) : 0) + smod(inf.st);
    dmg += silahDmg() + (silah().mod.ates || 0) + (silah().mod.savurma || 0) + (hasRelic('adak_tasi') ? 2 : 0);
    if (hasRelic('pasli')) dmg += 1;
    dmgEnemy(e, Math.max(1, dmg), crit ? 'kritik' : '');
  });
  if (crit && hasRelic('musvedde')) C.ink += 1;
  renderCombat();
}

  if (!def.boss && def.intents.length > 1 && id !== 'cellat') e.ii = RNGm.int(0, def.intents.length - 1);
  chooseIntent(e);

function chooseIntent(e) {

    e.intent = d.yariIntent;

  if (d.yariIntent && d.yariIntent.kabir && e.adak && !C.ebsarBirakti && (e.ii % 2 === 1)) { e.ii++; e.intent = d.yariIntent; return; }

}

async function playCard(hi, target) {

  if (needT) {
    if (!target || target.hp <= 0) return;

  }

  await d.play(card.u, target, cardInfo);
  if (d.tur === 'kalem') {

    }

    }

    }

async function doIntent(e) {
  const it = e.intent;
  const node = $(`.dusman[data-i="${e.i}"]`);

  else if (node) { node.classList.remove('vur'); void node.offsetWidth; node.classList.add('vur'); }

    say('Ebsar kendiliğinden kalktı ve Paşa\'nın ağır darbesini savuşturdu. Kılıç seni değil, kendini koruyordu.');

  }
  if (it.dmg) {

    if (e.def.delikan && e.hp < e.maxHp / 2) hits *= 2;
    const [a, b] = pusuDmg(e, it);
    for (let h = 0; h < hits && G.hp > 0 && e.hp > 0; h++) {
      let n = Math.max(0, RNGd.int(a, b) + (e.st.guc || 0) + (e.ek || 0));
      if (e.st.zayif > 0) { n = Math.floor(n / 2); e.st.zayif--; }
      await dealToPlayer(n, e);
      await sleep(180);
    }
    e.revealed = false;
  }
  if (it.block) { e.block += it.block; }
  if (it.allyBlock) {
    const others = liveEnemies().filter(x => x !== e);
    if (others.length) others.forEach(x => (x.block += it.allyBlock)); else e.block += it.allyBlock;
  }
  if (it.guc) e.st.guc = (e.st.guc || 0) + it.guc;
  if (it.pst) for (const k in it.pst) { C.p[k] = (C.p[k] || 0) + it.pst[k]; }
  if (it.ozel && e.id === 'pullukul') { say('Pullukul çehresini açtı: Semonya\'ya adak. Kanın donuyor.'); }
  else if (it.ozel && e.id === 'gulbeyaban') { say('Mor tüyler ölü bir orman gibi kabardı. Mağara, en çok arzuladığın şeyin vehmiyle doldu.'); }

async function checkEnd() {

function winCombat() {

  const gold = (kind === 'boss' ? 80 : kind === 'elit' ? RNGm.int(30, 40) : RNGm.int(12, 20)) + (C.ekAltin || 0);
  const bossE = C.enemies.find(e => e.def.boss);
  const bossRelic = kind !== 'boss' ? null : (G.perde || 1) === 1 ? 'semonya' : ({ gulbeyaban: 'urpolo', zehrigobul: 'elikan', gabyar: 'gabyar_defteri' })[bossE && bossE.id] || null;
  if ((G.perde || 1) >= 2 && G.parilti != null) G.parilti = Math.min(pariltiMax(), G.parilti + 1);
  // ödül paketini hazırla (yeniden yüklemeye dayanıklı)
  const n = hasFeat('katip_gozu') ? 4 : 3;
  const cards = [];
  let guard = 0;
  while (cards.length < n && guard++ < 50) {
    let r;
    if (kind === 'boss') r = RNGm.next() < 0.5 ? 'efsane' : 'nadir';
    else if (kind === 'elit') r = RNGm.weighted([['yaygin', 40], ['nadir', 45], ['efsane', 15]]);
    else r = RNGm.weighted([['yaygin', 60], ['nadir', 33], ['efsane', 7]]);
    const id = RNGm.pick(poolFor(r));
    if (!cards.includes(id)) cards.push(id);
  }
  if ((G.perde || 1) >= 2 && !cards.some(id => CARDS[id].buyu)) {
    const bh = [...poolFor('yaygin'), ...poolFor('nadir'), ...(kind !== 'normal' ? poolFor('efsane') : [])].filter(id => CARDS[id].buyu && !cards.includes(id));
    if (bh.length) cards[cards.length - 1] = RNGm.pick(bh);
  }
  const up = RNGm.next() < 0.12;
  G.reward = {
    kind, gold, cards, cardUp: up, picked: false, bossId: bossE ? bossE.id : null,
    relic: kind === 'boss' ? bossRelic : kind === 'elit' ? randomRelic() : null,
    level: (G.perde || 1) === 1 ? (kind === 'elit' || kind === 'boss') : ((kind === 'boss' || (kind === 'elit' && (G.elitSay = (G.elitSay || 0) + 1) % 2 === 1)) && G.lvl < ((G.perde || 1) === 2 ? 8 : 12)), eye: (kind === 'elit' || kind === 'boss') && G.ebsar && (G.perde || 1) === 1
  };
  gainGold(gold);
  if (G.reward.relic) { gainRelic(G.reward.relic); }
  C = null;
  G.scene = 'odul'; saveRun();
  playTrack('harita');
  render();
}
