      px(mx + x, my + y, lit < -0.35 ? sh : col);
    }
  };
  moon(W * 0.73, H * 0.12, 15, '#d6cfe6', '#9d94bd', 'rgba(200,190,240,A)', '0.35');
  px(W * 0.73 - 4, H * 0.12 - 3, '#b9b0d0', 3, 2); px(W * 0.73 + 5, H * 0.12 + 4, '#b9b0d0', 2, 2);
  moon(W * 0.9, H * 0.22, 5, '#c42a44', '#7a1428', 'rgba(220,40,60,A)', '0.45');
  // uzak şehir (sisli)
  const city = (yb, col, win, hmin, hmax, seed) => {
    const Rr = new RNG(seed); let x = -4;
    while (x < W) {
      const bw = Rr.int(8, 18), bh = Rr.int(hmin, hmax); const y0 = yb - bh;
      px(x, y0, col, bw, H - y0);
      if (Rr.next() < 0.5) { const r = Math.floor(bw / 2); for (let yy = 0; yy <= r; yy++) { const ww = Math.round(Math.sqrt(r * r - yy * yy)); px(x + bw / 2 - ww, y0 - yy, col, ww * 2, 1); } px(x + bw / 2, y0 - r - 3, col, 1, 3); }
      if (Rr.next() < 0.2) { px(x + 3, y0 - 20, col, 3, 20); px(x + 2, y0 - 20, col, 5, 2); px(x + 4, y0 - 24, col, 1, 4); }
      if (win) for (let k = 0; k < 3; k++) if (Rr.next() < 0.45) px(x + Rr.int(2, bw - 3), y0 + Rr.int(3, Math.max(4, bh - 4)), win, 1, 2);
      x += bw;
    }
  };
  city(H * 0.56, '#2e2140', null, 12, 30, 1);
  city(H * 0.6, '#1d1529', '#d78a33', 8, 22, 2);
  // sis bandı (ufuk)
  for (let y = H * 0.5; y < H * 0.62; y++) for (let x = 0; x < W; x++) if ((0.35 + BAYER4[((y | 0) & 3) * 4 + (x & 3)]) > 0.5 - (y - H * 0.5) / (H * 0.4)) { if ((x + (y | 0)) % 2 === 0) px(x, y, 'rgba(120,90,150,0.18)'); }
  // kapı duvarı
  const gx0 = Math.round(W * 0.12), gx1 = Math.round(W * 0.88), gy0 = Math.round(H * 0.2), gy1 = Math.round(H * 0.68);
  const torches = [[W * 0.24, H * 0.42], [W * 0.76, H * 0.42]];
  for (let y = gy0; y < gy1; y++) for (let x = gx0; x < gx1; x++) {
    const row = Math.floor((y - gy0) / 6), off = (row % 2) * 6;
    const mortar = ((y - gy0) % 6 === 0) || ((x - gx0 + off) % 12 === 0);
    let l = 0; for (const [tx, ty] of torches) l += Math.max(0, 1 - Math.hypot(x - tx, (y - ty) * 1.3) / 46);
    l += BAYER4[(y & 3) * 4 + (x & 3)] * 0.25;
    const col = mortar ? (l > 0.45 ? '#3a2a2a' : '#1d1622') : l > 0.75 ? '#8a5a3a' : l > 0.45 ? '#5e4446' : l > 0.2 ? '#40343f' : '#2c2433';
    px(x, y, col);
  }
  // mazgallar
  for (let x = gx0; x < gx1; x += 10) px(x, gy0 - 6, '#2c2433', 6, 6);
  // çini kitabe şeridi
  const ky = gy0 + 14;
  px(W * 0.3, ky, '#14232e', W * 0.4, 9);
  for (let x = W * 0.3 + 1; x < W * 0.7 - 1; x += 4) { px(x, ky + 1, '#1f6f6a', 3, 7); px(x + 1, ky + 3, '#dfa52a', 1, 3); }
  px(W * 0.3, ky, '#b8893a', W * 0.4, 1); px(W * 0.3, ky + 9, '#b8893a', W * 0.4, 1);
  // kemer açıklığı

    const inArch = y >= atop || Math.hypot(x - ax, (y - atop) * 1.15) <= aw;
    if (!inArch) continue;
    const depth = (y - (atop - aw)) / (gy1 - atop + aw);
    const t = depth + BAYER4[(y & 3) * 4 + (x & 3)] * 0.35;
    px(x, y, t > 0.85 ? '#1d0f1a' : t > 0.55 ? '#120a14' : '#08060c');
  }
  // kemer taşı kenarı
  for (let a = Math.PI; a <= Math.PI * 2; a += 0.02) { px(ax + Math.cos(a) * (aw + 2), atop + Math.sin(a) * (aw + 2) / 1.15, '#6b5560', 2, 2); }
  px(ax - aw - 3, atop, '#4a3d48', 3, gy1 - atop); px(ax + aw + 1, atop, '#4a3d48', 3, gy1 - atop);
  // meşaleler
  torches.forEach(([tx, ty]) => { px(tx - 1, ty, '#3b2a1e', 3, 9); px(tx - 3, ty - 1, '#5a3d1a', 7, 2); px(tx - 2, ty - 6, '#ea4a26', 5, 5); px(tx - 1, ty - 9, '#ff9a3c', 3, 4); px(tx, ty - 11, '#f4d27a', 1, 3); });
  // zemin: perspektif arnavut kaldırımı
  const gy = gy1;
  for (let y = gy; y < H; y++) {
    const t = (y - gy) / (H - gy);
    const sh = 3 + Math.floor(t * 8);
    const rowI = Math.floor(Math.pow(t, 0.7) * 14);
    for (let x = 0; x < W; x++) {
      const persp = (x - W / 2) / (0.6 + t * 1.6);
      const cell = Math.floor((persp + rowI * 3) / sh);
      const edge = Math.floor(((persp + rowI * 3) % sh + sh) % sh) === 0 || (Math.floor(Math.pow((y + 1 - gy) / (H - gy), 0.7) * 14) !== rowI);
      let l = 0; for (const [tx] of torches) l += Math.max(0, 1 - Math.hypot(x - tx, (y - gy) * 2.2) / 60);
      l += Math.max(0, 1 - Math.hypot(x - W / 2, (y - gy - 18) * 2) / 55) * 0.6;

  torches.forEach(([tx, ty]) => { const g2 = c.createRadialGradient(tx, ty - 6, 2, tx, ty - 6, 46); g2.addColorStop(0, 'rgba(255,150,60,0.55)'); g2.addColorStop(0.4, 'rgba(234,74,38,0.18)'); g2.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g2; c.fillRect(tx - 50, ty - 56, 100, 100); });
  const g3 = c.createRadialGradient(W / 2, H * 0.5, 4, W / 2, H * 0.5, 70); g3.addColorStop(0, 'rgba(120,40,70,0.25)'); g3.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g3; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = 'source-over';
  // yer sisi
  for (let y = Math.round(H * 0.7); y < H; y++) for (let x = 0; x < W; x++) {
    const t = Math.sin(x * 0.08 + y * 0.03) * 0.5 + 0.5;

  c.globalCompositeOperation = 'multiply';
  const v = c.createRadialGradient(W / 2, H * 0.48, H * 0.25, W / 2, H * 0.5, H * 0.75);

  c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = 'source-over';
  cv.className = 'px bg2';
  cv._torches = torches.map(([x, y]) => [x / W, y / H]);
  return cv;
}

// Taş doku (arayüz)
function tasDoku() {
  const cv = document.createElement('canvas'); cv.width = 48; cv.height = 48;
  const c = cv.getContext('2d'); const R = new RNG(99);
  for (let y = 0; y < 48; y++) for (let x = 0; x < 48; x++) {
    const blk = ((y % 16 === 0) || ((x + (Math.floor(y / 16) % 2) * 12) % 24 === 0));

// Kıvılcımlar
function korKivilcim(host) {
  const cv = document.createElement('canvas'); cv.className = 'px kivilcim';
  cv.width = 100; cv.height = 150; host.appendChild(cv);
  const c = cv.getContext('2d');
  const P = Array.from({ length: 26 }, () => ({ x: Math.random() * 100, y: 150 * Math.random(), v: 0.15 + Math.random() * 0.3, s: Math.random() * 6 }));

// ---- 09a_sahne.js ----
// ===== Boyanmış sahneler (v2) =====
// Piksel gölgelendirici: her sahne ImageData'ya piksel piksel boyanır, ışıklar
// ortak bir modelle hesaplanır, sonra parıltı ve vinyet katmanları eklenir.
const _bgCache = {};
const DARKC = [14, 9, 26];
function Sahne(W, H) {
  const img = new ImageData(W, H), d = img.data;
  const S = {
    W, H, img, lights: [],
    B: (x, y) => BAYER4[(y & 3) * 4 + (x & 3)],
    put(x, y, c) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return; const i = (y * W + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; },
    get(x, y) { x = clamp(x | 0, 0, W - 1); y = clamp(y | 0, 0, H - 1); const i = (y * W + x) * 4; return [d[i], d[i + 1], d[i + 2]]; },
    rect(x0, y0, w, h, c) { for (let y = Math.round(y0); y < Math.round(y0 + h); y++) for (let x = Math.round(x0); x < Math.round(x0 + w); x++) S.put(x, y, c); },
    // ışık: {x,y,r,k,c:[rgb]}
    lit(x, y) {
      let v = 0, t = [0, 0, 0];
      for (const L of S.lights) {
        const dd = Math.hypot(x - L.x, (y - L.y) * (L.sy || 1)) / L.r;
        if (dd >= 1) continue;
        const f = Math.pow(1 - dd, 1.6) * L.k;
        v += f; t[0] += L.c[0] * f; t[1] += L.c[1] * f; t[2] += L.c[2] * f;
      }
      if (v > 0) t = t.map(q => q / v);
      return { v, t };
    },
    // taban rengi + ortam ışığı + noktasal ışıklar → kademeli, titreşimli renk
    shade(base, x, y, amb = 0.35, ext = 0) {
      const L = S.lit(x, y);
      let l = amb + L.v + ext + S.B(x, y) * 0.22;
      l = Math.floor(l * 4) / 4;
      if (l <= 1) {
        const dk = mixc(mulc(base, 0.18), DARKC, 0.55);
        let c = mixc(dk, base, clamp(l, 0, 1));
        if (L.v > 0.05) c = mixc(c, mixc(c, L.t, 0.5), clamp(L.v, 0, 0.6));
        return c;
      }
      const hi = L.v > 0.05 ? mixc(L.t, [255, 240, 210], 0.35) : [235, 225, 255];
      return mixc(base, hi, clamp((l - 1) * 0.7, 0, 0.7));
    },
    grad(y0, y1, stops, x0 = 0, x1 = W) {
      const band = (y1 - y0) / (stops.length - 1);
      for (let y = Math.round(y0); y < Math.round(y1); y++) {
        const fi = (y - y0) / band, i = Math.min(stops.length - 2, Math.floor(fi)), t = fi - i;
        for (let x = x0; x < x1; x++) S.put(x, y, (t + S.B(x, y) * 0.9) > 0.5 ? stops[i + 1] : stops[i]);
      }
    },
    stars(n, y1, R) { for (let i = 0; i < n; i++) { const r = R.next(); S.put(R.int(0, W - 1), R.int(0, y1), r < 0.2 ? [242, 238, 230] : r < 0.6 ? [143, 134, 176] : [90, 80, 128]); } },
    moon(mx, my, r, col, sh) {
      for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
        if (x * x + y * y > r * r) continue;
        const lit = (-x * 0.7 - y * 0.7) / r + BAYER4[((y + 64) & 3) * 4 + ((x + 64) & 3)] * 0.3;
        S.put(mx + x, my + y, lit < -0.35 ? sh : col);
      }
    },
    city(yb, col, win, hmin, hmax, seed, x0 = 0, x1 = W) {
      const R = new RNG(seed); let x = x0 - 4;
      while (x < x1) {
        const bw = R.int(8, 18), bh = R.int(hmin, hmax), y0 = yb - bh;
        S.rect(x, y0, bw, H - y0, col);
        if (R.next() < 0.5) { const r = Math.floor(bw / 2); for (let yy = 0; yy <= r; yy++) { const ww = Math.round(Math.sqrt(r * r - yy * yy)); S.rect(x + bw / 2 - ww, y0 - yy, ww * 2, 1, col); } S.rect(x + bw / 2, y0 - r - 3, 1, 3, col); }
        if (R.next() < 0.22) { S.rect(x + 3, y0 - 20, 3, 20, col); S.rect(x + 2, y0 - 20, 5, 2, col); S.rect(x + 4, y0 - 24, 1, 4, col); }
        if (win) for (let k = 0; k < 3; k++) if (R.next() < 0.45) S.rect(x + R.int(2, bw - 3), y0 + R.int(3, Math.max(4, bh - 4)), 1, 2, win);
        x += bw;
      }
    },
    finish(opts = {}) {
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const c = cv.getContext('2d');
      c.putImageData(img, 0, 0);
      c.globalCompositeOperation = 'screen';
      for (const L of S.lights) {
        if (L.glow === 0) continue;
        const g = c.createRadialGradient(L.x, L.y, 1, L.x, L.y, L.r * (L.glow || 0.8));
        const [r, gg, b] = L.c;
        g.addColorStop(0, `rgba(${r},${gg},${b},${0.45 * L.k})`); g.addColorStop(0.45, `rgba(${r},${gg},${b},${0.12 * L.k})`); g.addColorStop(1, 'rgba(0,0,0,0)');

// --- Kütüphane: raflar, kemerli pencere, ay huzmesi, şamdanlar ---
function sahneKutuphane(W, H) {

  S.lights.push({ x: cx, y: wy + H * 0.08, r: W * 0.3, sy: 2.2, k: 0.55, c: [150, 170, 255], glow: 0 });
  const wall = hx('#3a2a3c'), wall2 = hx('#2e2232');

    S.put(x, y, S.shade(mortar ? wall2 : wall, x, y, 0.22));
  }
  // pencere: gece göğü, ay
  const inWin = (x, y) => y >= winTop + winW / 2 ? (y < winBot && Math.abs(x - cx) < winW / 2) : Math.hypot(x - cx, y - (winTop + winW / 2)) < winW / 2;
  const sky = [hx('#0b0817'), hx('#15102a'), hx('#22183a'), hx('#2f2048')];
  for (let y = Math.floor(winTop); y < winBot; y++) for (let x = Math.floor(cx - winW / 2); x <= cx + winW / 2; x++) {
    if (!inWin(x, y)) continue;
    const t = (y - winTop) / (winBot - winTop) * 3 + S.B(x, y) * 0.9; S.put(x, y, sky[clamp(Math.floor(t), 0, 3)]);
  }
  S.moon(Math.round(cx + winW * 0.18), Math.round(winTop + winW * 0.45), Math.max(4, Math.round(winW * 0.17)), hx('#d6cfe6'), hx('#9d94bd'));
  for (let i = 0; i < 14; i++) { const x = R.int(cx - winW / 2, cx + winW / 2), y = R.int(winTop, winBot); if (inWin(x, y)) S.put(x, y, [143, 134, 176]); }
  // kafes çubukları ve kemer
  for (let y = Math.floor(winTop); y < winBot; y++) for (let x = Math.floor(cx - winW / 2 - 3); x <= cx + winW / 2 + 3; x++) {
    const ins = inWin(x, y);
    const rim = !ins && (inWin(x - 3, y) || inWin(x + 3, y) || inWin(x, y - 3) || inWin(x, y + 3));
    if (rim) S.put(x, y, S.shade(hx('#6b5560'), x, y, 0.4));
    else if (ins && (Math.abs(x - cx) < 1 || Math.round(y - winTop) % Math.round(winW / 2.5) === 0)) S.put(x, y, hx('#1a1218'));
  }
  // raflar (iki yanda)
  const bookCols = ['#6b2a2a', '#2f4a6b', '#4a5a2a', '#7a4a1f', '#3d2a4a', '#7a6a3a', '#5a1626', '#1f4a46'].map(hx);
  const shelfX = [[0, W * 0.34], [W * 0.66, W]];
  const shelfH = Math.max(18, Math.round(H * 0.095));
  shelfX.forEach(([x0, x1], si) => {

    }
    // raf yan direği
    const px0 = si === 0 ? x1 - 3 : x0;
    for (let y = top; y < wy; y++) for (let x = px0; x < px0 + 3; x++) S.put(x, y, S.shade(hx('#5a3a26'), x, y, 0.3));
  });
  // zemin: perspektif tahta

    for (let x = 0; x < W; x++) {
      const u = (x - vx) / (y - vy) * 10; // tahta şeridi
      const seam = Math.abs(u - Math.round(u)) < 0.05 + t * 0.02;
      const plank = Math.round(u);
      const cross = ((Math.floor((y - wy) / (3 + t * 10)) + plank * 3) % 5 === 0) && Math.floor((y - wy) % (3 + t * 10)) === 0;
      const base = (plank & 1) ? hx('#4e3020') : hx('#5a3826');

    [-4, 0, 4].forEach(dx => { S.rect(x + dx - 1, y - 5, 2, 5, hx('#e6e0d2')); S.put(x + dx, y - 6, hx('#ff9a3c')); S.put(x + dx, y - 7, hx('#f4d27a')); });

  // yerdeki dağınık kâğıtlar
  for (let i = 0; i < 9; i++) { const x = R.int(10, W - 14), y = R.int(wy + 6, H - 8); S.rect(x, y, R.int(3, 6), 2, S.shade(hx('#d6c8a6'), x, y, 0.3)); }

  c.globalCompositeOperation = 'source-over';
  cv._parca = 'toz';
  return cv;
}

// --- Sarnıç: perspektifte sütun sıraları, kemerler, su yansıması ---
function sahneSarnic(W, H) {
  const S = Sahne(W, H), R = new RNG(532);
  const vx = W / 2, hor = H * 0.5, waterY = H * 0.62;
  S.lights.push({ x: W * 0.22, y: H * 0.36, r: W * 0.38, k: 1.0, c: [255, 150, 60], flick: 'fener' });
  S.lights.push({ x: W * 0.82, y: H * 0.42, r: W * 0.3, k: 0.8, c: [255, 150, 60], flick: 'fener' });
  S.lights.push({ x: vx, y: hor, r: W * 0.35, k: 0.35, c: [60, 200, 180], glow: 1.4 });
  // karanlık zemin
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) S.put(x, y, S.shade(hx('#16202a'), x, y, 0.12));
  // sütun sıraları: uzaktan yakına
  const rows = 6;
  for (let k = 0; k < rows; k++) {
    const s = 0.18 + Math.pow(k / (rows - 1), 1.5) * 1.1;
    const fog = 1 - k / (rows - 1);
    const colW = Math.max(2, Math.round(17 * s * W / 200));
    const top = hor - H * 0.5 * s, bot = hor + (waterY - hor) * 0.3 + H * 0.16 * s;
    const sp = W * 0.44 * s;
    // kemerler: tavan
    for (let i = -4; i <= 4; i++) {
      const ax = vx + (i + 0.5) * sp, ar = sp / 2;
      for (let a = Math.PI; a <= Math.PI * 2; a += 0.6 / Math.max(ar, 1)) {
        for (let tt = 0; tt < Math.max(1, colW * 0.6); tt++) {
          const x = ax + Math.cos(a) * (ar + tt), y = top + Math.sin(a) * (ar * 0.7 + tt);
          const brick = ((Math.round(a * ar) + tt) % 4 === 0);
          S.put(x, y, mixc(S.shade(brick ? hx('#4a2e2a') : hx('#6a4236'), x, y, 0.3), hx('#0f2a2e'), fog * 0.75));
        }
      }
    }
    for (let i = -4; i <= 4; i++) {
      const x0 = vx + i * sp - colW / 2;
      if (x0 > W + 4 || x0 + colW < -4) continue;
      for (let y = Math.round(top - 2); y < bot; y++) for (let x = Math.round(x0); x < x0 + colW; x++) {
        const u = (x - x0) / colW;
        const rnd = 0.35 + Math.sin(u * Math.PI) * 0.4 - (u > 0.65 ? 0.25 : 0);
        const band = (Math.round(y - top) % Math.max(4, Math.round(14 * s))) === 0;
        let c = S.shade(band ? hx('#5a4f5a') : hx('#8a7a78'), x, y, rnd * 0.6);
        S.put(x, y, mixc(c, hx('#0f2a2e'), fog * 0.75));
      }
      // başlık
      for (let x = Math.round(x0 - colW * 0.3); x < x0 + colW * 1.3; x++) for (let y = Math.round(top - 2 - colW * 0.5); y < top - 2; y++) S.put(x, y, mixc(S.shade(hx('#9a8a80'), x, y, 0.4), hx('#0f2a2e'), fog * 0.75));
    }
  }
  // su: yansıma + dalga
  for (let y = Math.round(waterY); y < H; y++) {
    const t = (y - waterY) / (H - waterY);
    for (let x = 0; x < W; x++) {
      const wob = Math.round(Math.sin(y * 0.9 + x * 0.05) * (1 + t * 2));
      const my = Math.round(waterY - (y - waterY) * 0.9);
      let c = S.get(x + wob, my);
      c = mixc(c, hx('#0c2a30'), 0.45 + t * 0.2);
      const rip = (Math.sin(x * 0.3 + y * 1.7) + S.B(x, y)) > 1.1;
      if (rip) c = mixc(c, [120, 210, 200], 0.18);
      S.put(x, y, c);
    }
  }
  for (let x = 0; x < W; x++) S.put(x, waterY, mixc(S.get(x, waterY), [140, 220, 210], 0.3));
  // fenerler
  [[W * 0.22, H * 0.36], [W * 0.82, H * 0.42]].forEach(([x, y]) => {
    S.rect(x, y - 14, 1, 9, hx('#2a1a10'));
    S.rect(x - 3, y - 5, 7, 2, hx('#5a3d1a')); S.rect(x - 2, y - 3, 5, 6, hx('#ff9a3c')); S.rect(x - 1, y - 2, 3, 3, hx('#f4d27a')); S.rect(x - 3, y + 3, 7, 1, hx('#5a3d1a'));
  });
  const cv = S.finish({ vin: 'rgba(20,30,40,1)' });
  cv._parca = 'damla';
  cv._su = waterY / H;
  return cv;
}

// --- Sokak: perspektif cumbalı ahşap evler, uzaktaki kapı, kaldırım ---
function sahneSokak(W, H) {
  const S = Sahne(W, H), R = new RNG(1071);
  const vx = W / 2, near = { top: -H * 0.05, bot: H * 0.9 }, farX = W * 0.36, far = { top: H * 0.3, bot: H * 0.62 };
  // gökyüzü şeridi
  S.grad(0, H * 0.62, [hx('#0b0817'), hx('#140e28'), hx('#22183a'), hx('#3d2142')]);
  S.stars(40, H * 0.3, R);
  S.moon(Math.round(W * 0.56), Math.round(H * 0.1), Math.max(5, Math.round(W * 0.05)), hx('#d6cfe6'), hx('#9d94bd'));
  // fener ışıkları
  S.lights.push({ x: W * 0.3, y: H * 0.42, r: W * 0.36, k: 0.9, c: [255, 150, 60], flick: 'fener' });
  S.lights.push({ x: W * 0.74, y: H * 0.5, r: W * 0.3, k: 0.8, c: [255, 150, 60], flick: 'fener' });
  S.lights.push({ x: vx, y: H * 0.5, r: W * 0.18, k: 0.6, c: [255, 120, 60] });
  // uzak cephe
  S.city(far.top + H * 0.02, hx('#1d1529'), hx('#d78a33'), 4, 14, 9, W * 0.3, W * 0.7);
  for (let y = Math.round(far.top); y < far.bot; y++) for (let x = Math.round(farX); x < W - farX; x++) {
    const door = Math.abs(x - vx) < W * 0.03 && y > far.bot - H * 0.09;
    const win = (Math.abs(x - vx + W * 0.07) < W * 0.02 || Math.abs(x - vx - W * 0.07) < W * 0.02) && y > far.top + H * 0.06 && y < far.top + H * 0.12;
    S.put(x, y, door ? hx('#1a0e0c') : win ? hx('#f0a050') : S.shade(hx('#4a3446'), x, y, 0.3));
  }
  // yan duvarlar (perspektif: u=0 yakın, u=1 uzak)
  const houses = [hx('#6b4a2f'), hx('#5a2a2a'), hx('#34405a'), hx('#5e5236')];
  const side = (mir) => {
    for (let xi = 0; xi < farX; xi++) {
      const u = xi / farX, x = mir ? W - 1 - xi : xi;
      const ut = Math.pow(u, 1.6); // görsel derinlik
      const yt = near.top + (far.top - near.top) * u, yb = near.bot + (far.bot - near.bot) * u;
      const hi = Math.floor(ut * 4.999 + (mir ? 0.5 : 0)) % 4;
      for (let y = Math.max(0, Math.floor(yt)); y < yb; y++) {
        const v = (y - yt) / (yb - yt);
        const hu = (ut * 5 + (mir ? 0.5 : 0)) % 1; // ev içi konum
        let c = houses[hi];
        const plank = Math.floor(v * 40) % 2 === 0 && Math.floor(v * 80) % 4 === 0;
        if (plank) c = mulc(c, 0.75);
        // cumba çıkıntısı ve kat kirişleri
        if (Math.abs(v - 0.42) < 0.012 || Math.abs(v - 0.15) < 0.012) c = hx('#2a1a10');
        if (hu < 0.04 || hu > 0.96) c = hx('#2a1a10');
        // pencereler
        const wv = (v > 0.2 && v < 0.34) || (v > 0.5 && v < 0.64);
        const wu = hu > 0.3 && hu < 0.7;
        let lit = 0;
        if (wv && wu) {
          const on = ((hi * 3 + (v > 0.4 ? 1 : 0) + (mir ? 5 : 0)) % 3) !== 0;
          const lat = (Math.floor(hu * 30) % 3 === 0) || (Math.floor(v * 90) % 3 === 0);
          c = on ? (lat ? hx('#7a3a18') : hx('#f0a050')) : (lat ? hx('#1a1218') : hx('#141826'));
          if (on) { S.put(x, y, c); continue; }
        }
        if (v > 0.86) c = mulc(c, 0.55); // taban
        S.put(x, y, S.shade(c, x, y, 0.16 + (1 - u) * 0.08, lit));
      }
      // saçak gölgesi
      for (let y = Math.max(0, Math.floor(yt - 3 * (1 - u) - 1)); y < yt; y++) S.put(x, y, hx('#120c10'));
    }
  };
  side(false); side(true);
  // kaldırım
  for (let y = Math.round(far.bot); y < H; y++) {
    const t = (y - far.bot) / (H - far.bot);
    const xl = farX * (1 - t), xr = W - xl;
    for (let x = 0; x < W; x++) {
      if (x < xl - 1 && y < near.bot + (far.bot - near.bot) * (x / farX)) continue;
      if (x > xr + 1 && y < near.bot + (far.bot - near.bot) * ((W - 1 - x) / farX)) continue;
      const pr = (x - vx) / (0.3 + t * 1.6);
      const row = Math.floor(Math.pow(t, 0.7) * 16), sh = 3 + Math.floor(t * 7);
      const edge = Math.floor(((pr + row * 3) % sh + sh) % sh) === 0 || Math.floor(Math.pow((y + 1 - far.bot) / (H - far.bot), 0.7) * 16) !== row;
      const cell = Math.floor((pr + row * 3) / sh);
      const n = ((cell * 37 + row * 11) % 7) / 7;
      S.put(x, y, edge ? hx('#120e18') : S.shade(mixc(hx('#3a3040'), hx('#4e4048'), n), x, y, 0.15 + t * 0.06));
    }
  }
  // asılı fenerler
  [[W * 0.3, H * 0.42], [W * 0.74, H * 0.5]].forEach(([x, y], i) => {
    const wx = i ? W - 1 : 0;
    for (let xx = Math.min(wx, x); xx < Math.max(wx, x); xx++) S.put(xx, y - 10, hx('#2a1a10'));
    S.rect(x, y - 10, 1, 5, hx('#2a1a10'));
    S.rect(x - 3, y - 5, 7, 2, hx('#3b2a1e')); S.rect(x - 2, y - 3, 5, 6, hx('#ff9a3c')); S.rect(x - 1, y - 2, 3, 3, hx('#f4d27a')); S.rect(x - 3, y + 3, 7, 1, hx('#3b2a1e'));
  });
  const cv = S.finish();
  cv._parca = 'kul';
  return cv;
}

// --- Oda: Paşa'nın konağı; çini lambri, kafesli pencere, sedir, kandil ---
function sahneOda(W, H) {
  const S = Sahne(W, H), R = new RNG(77);

  S.lights.push({ x: W * 0.78, y: H * 0.36, r: W * 0.5, k: 1.1, c: [255, 160, 70], flick: 'mum' });

      const lx = x % 8, ly = (y - Math.round(fy - H * 0.26)) % 8;

      if (Math.abs(lx - 3.5) + Math.abs(ly - 3.5) < 1) c = hx('#1f2f5c');
    } else c = (y % 9 === 0) ? hx('#5a3a3a') : hx('#7a5a4a');
    if (Math.abs(y - (fy - H * 0.26)) < 2) c = hx('#b8893a');
    S.put(x, y, S.shade(c, x, y, 0.28));
  }

  const wx0 = W * 0.18, wx1 = W * 0.42, wy0 = H * 0.08, wy1 = H * 0.42;
  for (let y = Math.round(wy0); y < wy1; y++) for (let x = Math.round(wx0); x < wx1; x++) {
    const lat = ((x + y) % 5 === 0) || ((x - y + 500) % 5 === 0);
    const edge = x < wx0 + 2 || x > wx1 - 3 || y < wy0 + 2 || y > wy1 - 3;
    S.put(x, y, edge ? S.shade(hx('#5a3a26'), x, y, 0.4) : lat ? hx('#2a1a10') : mixc(hx('#22183a'), hx('#3d2a5a'), (y - wy0) / (wy1 - wy0)));
  }
  // niş ve kandil
  const nx = W * 0.78, ny = H * 0.3;
  for (let y = Math.round(ny - H * 0.12); y < ny + H * 0.1; y++) for (let x = Math.round(nx - W * 0.06); x < nx + W * 0.06; x++) {
    const top = ny - H * 0.04;
    if (y < top && Math.hypot((x - nx) / (W * 0.06), (y - top) / (H * 0.08)) > 1) continue;
    S.put(x, y, S.shade(hx('#3a2228'), x, y, 0.2));
  }
  S.rect(nx - 4, ny + 4, 8, 3, hx('#b8893a')); S.rect(nx - 1, ny, 2, 4, hx('#ff9a3c')); S.put(nx, ny - 1, hx('#f4d27a'));
  // halı
  for (let y = Math.round(fy); y < H; y++) {
    const t = (y - fy) / (H - fy);
    for (let x = 0; x < W; x++) {
      const pr = (x - W / 2) / (0.5 + t);
      const brd = Math.abs(pr) > W * 0.36 && Math.abs(pr) < W * 0.4;
      const mot = ((Math.floor(pr / 6) + Math.floor((y - fy) / (3 + t * 6))) % 2 === 0);
      let c = Math.abs(pr) > W * 0.4 ? hx('#3b2a1e') : brd ? hx('#dfa52a') : mot ? hx('#8a1a2a') : hx('#6a1020');

function paintScene(kind, W, H) {
  const key = kind + W + 'x' + H;
  if (!_bgCache[key]) {
    _bgCache[key] = (typeof SAHNE23 !== 'undefined' && SAHNE23[kind]) ? SAHNE23[kind](W, H) : kind === 'kapi' ? paintBg('kapi', W, H)
      : kind === 'kutuphane' ? sahneKutuphane(W, H)
      : kind === 'sarnic' ? sahneSarnic(W, H)
      : kind === 'sokak' ? sahneSokak(W, H)
      : kind === 'baslik' ? sahneBaslik(W, H)
      : sahneOda(W, H);
    if (kind === 'kapi') { _bgCache[key]._parca = 'kivilcim'; _bgCache[key]._lights = _bgCache[key]._torches.map(([x, y]) => ({ x, y, tip: 'mesale' })); }
  }
  const src = _bgCache[key];
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  cv.getContext('2d').drawImage(src, 0, 0);
  cv.className = 'px bg2';
  cv._parca = src._parca; cv._lights = src._lights || []; cv._su = src._su;
  return cv;
}

// Sahne ışık titreşimi katmanı
function isikKatmani(host, lights) {
  const glow = el('div', 'isiklar');
  lights.forEach(L => { const g = el('i', 'mesale ' + (L.tip || '')); g.style.left = L.x * 100 + '%'; g.style.top = L.y * 100 + '%'; g.style.animationDelay = (-Math.random() * 1.6).toFixed(2) + 's'; glow.appendChild(g); });
  host.appendChild(glow);
}

// Sahne parçacıkları: kıvılcım, toz, damla, kül
function parcacik(host, kind, opts = {}) {
  const cv = document.createElement('canvas'); cv.className = 'px kivilcim';
  const W = 100, H = 150; cv.width = W; cv.height = H; host.appendChild(cv);
  const c = cv.getContext('2d');
  const n = { kivilcim: 26, toz: 30, damla: 7, kul: 34, kum: 40, tuz: 28 }[kind] || 20;
  const su = (opts.su || 0.65) * H;
  const P = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, v: Math.random(), s: Math.random() * 6, t: Math.random() * 100, sp: 0 }));
  const tick = () => {
    if (!cv.isConnected) return;
    c.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.t++;
      if (kind === 'kivilcim') {
        p.y -= 0.15 + p.v * 0.3; p.x += Math.sin((p.y + p.s * 20) * 0.05) * 0.15;
        if (p.y < 0) { p.y = H; p.x = Math.random() * W; }
        c.fillStyle = p.s > 4 ? '#f4d27a' : p.s > 2 ? '#ff9a3c' : '#ea4a26';
        c.globalAlpha = Math.min(1, p.y / 60); c.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
      } else if (kind === 'toz') {
        p.x += Math.sin(p.t * 0.01 + p.s) * 0.06; p.y += Math.cos(p.t * 0.013 + p.s) * 0.04 + 0.01;
        if (p.y > H) p.y = 0; if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        const beam = Math.max(0, 1 - Math.abs(p.x - W / 2) / 30);
        c.fillStyle = p.s > 3 ? '#f4e2b0' : '#c8b8e0';
        c.globalAlpha = 0.25 + 0.55 * beam * (0.5 + 0.5 * Math.sin(p.t * 0.05 + p.s)); c.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
      } else if (kind === 'kum') {
        p.x += 0.6 + p.v * 0.9; p.y += Math.sin(p.t * 0.05 + p.s) * 0.15;
        if (p.x > W) { p.x = -2; p.y = Math.random() * H; }
        c.fillStyle = p.s > 3 ? '#f0d8a8' : '#c8964a'; c.globalAlpha = 0.55; c.fillRect(Math.round(p.x), Math.round(p.y), p.s > 4 ? 2 : 1, 1);
      } else if (kind === 'tuz') {
        p.y += 0.08 + p.v * 0.1; p.x += Math.sin(p.t * 0.02 + p.s) * 0.12;
        if (p.y > H) { p.y = -2; p.x = Math.random() * W; }
        c.fillStyle = '#f2eee6'; c.globalAlpha = 0.6; c.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
      } else if (kind === 'kul') {
        p.y += 0.12 + p.v * 0.15; p.x += Math.sin(p.t * 0.03 + p.s) * 0.2 + 0.05;
        if (p.y > H) { p.y = -2; p.x = Math.random() * W; }
        c.fillStyle = p.s > 5 ? '#ff9a3c' : p.s > 2.5 ? '#9a94a4' : '#58535f';
        c.globalAlpha = 0.7; c.fillRect(Math.round(p.x), Math.round(p.y), p.s > 4 ? 1 : 2, 1);
      } else if (kind === 'damla') {
        if (p.sp > 0) { // halka
          p.sp++; const r = p.sp / 3;
          c.strokeStyle = '#8fd8cf'; c.globalAlpha = Math.max(0, 0.6 - p.sp / 30);
          c.fillStyle = c.strokeStyle;
          c.fillRect(Math.round(p.x - r), Math.round(su), 1, 1); c.fillRect(Math.round(p.x + r), Math.round(su), 1, 1);
          if (p.sp > 18) { p.sp = 0; p.y = -Math.random() * 120; p.x = Math.random() * W; }
        } else {
          p.y += 1.2 + p.v; c.fillStyle = '#8fd8cf'; c.globalAlpha = 0.8; c.fillRect(Math.round(p.x), Math.round(p.y), 1, 2);
          if (p.y >= su) { p.sp = 1; if (Math.random() < 0.3) sfxDamla(); }
        }
      }
    });
    c.globalAlpha = 1;
    requestAnimationFrame(tick);
  };
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
}
let _damlaT = 0;
function sfxDamla() { const n = Date.now(); if (n - _damlaT < 1800 || !AU.ctx || !AU.sfxOn) return; _damlaT = n; try { const t = AU.ctx.currentTime; const f = 1400 + Math.random() * 600; tone(AU.fx, t, f, 0.09, 'sine', 0.05, f * 0.55); } catch (e) { } }

// Sahneyi bir kaba yerleştir: arka plan + ışık + parçacık
function sahneKur(host, kind, W, H) {
  const bg = paintScene(kind, W, H);
  host.appendChild(bg);
  isikKatmani(host, bg._lights);
  parcacik(host, bg._parca, { su: bg._su });
  return bg;
}

// ===== Yüksek çözünürlüklü düşman figürleri =====
// part(fn): şekli çizer ve altında kalan parçayla arasına 1px kontur koyar.
function FigP(W, H) {
  const f = Fig(W, H);
  f.part = (fn) => {
    const old = f.g.map(r => r.slice());
    const sp = f.sprinkle;
    f.sprinkle = (c, onto, step, seed) => { const R = new RNG(seed || 7); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (f.g[y][x] === onto && old[y][x] !== onto && ((x * 7 + y * 13) % step === 0) && R.next() < 0.7) f.g[y][x] = c; };
    fn();
    f.sprinkle = sp;
    const mask = f.g.map((r, y) => r.map((c, x) => old[y][x] !== c));
    const ch = (x, y) => mask[y][x];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!ch(x, y)) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const X = x + dx, Y = y + dy;
        if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
        if (!ch(X, Y) && f.g[Y][X] !== '.' && f.g[Y][X] !== 'K') f.g[Y][X] = 'K';
      }
    }
  };
  return f;
}

    if (o.n[2] > 0.45) {

}
// Yuvarlanma animasyonu: değer v'ye oturur
function zarAt(cv, v, tema, ms) {
  const fi = D20G.num.indexOf(v);
  const roll = (Math.random() - 0.5) * 0.5;
  const Mt = m3.mul(m3.axis([0, 0, 1], roll), m3.toZ(D20G.N[fi]));
  if (!ms) { zarCiz(cv, Mt, tema); return Promise.resolve(); }
  const ax = (() => { const a = [Math.random() - 0.5, Math.random() - 0.5, Math.random() * 0.3]; const l = Math.hypot(...a); return a.map(q => q / l); })();
  const turns = Math.PI * 2 * (2.5 + Math.random() * 1.5);
  const t0 = performance.now();
  let lastB = -1;
  return new Promise(res => {
    const fr = () => {
      const u = Math.min(1, (performance.now() - t0) / ms);
      const e = 1 - Math.pow(1 - u, 3);
      const M = m3.mul(Mt, m3.axis(ax, turns * (1 - e)));
      // zıplamalar
      const b = u < 0.82 ? Math.floor(u / 0.82 * 3) : 3;
      const bu = (u / 0.82 * 3) % 1;
      const dy = b < 3 ? -Math.sin(bu * Math.PI) * 16 * Math.pow(0.45, b) * (cv.width / 64) : 0;
      if (b !== lastB) { lastB = b; if (b < 3 && b > 0) sfx('zarTik'); if (b === 3) sfx('tok'); }
      zarCiz(cv, M, tema, { dy });
      if (u < 1) requestAnimationFrame(fr); else res();
    };
    fr();
  });
}

// Ortak: dalgalı bir eğrinin altını doldur
function sDalga(S, y0, amp, fr, ph, colF) {
  for (let x = 0; x < S.W; x++) {
    const yy = y0 + Math.sin(x * fr + ph) * amp + Math.sin(x * fr * 2.3 + ph * 1.7) * amp * 0.35;
    for (let y = Math.max(0, Math.round(yy)); y < S.H; y++) S.put(x, y, colF(x, y, y - yy));
  }
}
// Keçe çadır (yurt): kubbe + gövde
function sCadir(S, cx, by, w, col, dark, kapi) {
  const h = w * 0.45, r = w / 2;
  for (let y = Math.round(by - h - r * 0.5); y < by; y++) for (let x = Math.round(cx - r); x <= cx + r; x++) {
    const dx = (x - cx) / r;
    const top = by - h - Math.sqrt(Math.max(0, 1 - dx * dx)) * r * 0.5;

  f.part(() => { f.path([[cx - 14, 30], [cx - 4, 26], [cx + 12, 30], [cx + 18, 40]], 5, 'r', 3); f.path([[cx + 18, 40], [cx + 22, 56]], 4, 'r', 2); f.ell(cx + 22, 57, 2, 2, 'M'); });

  f.path([[cx + 10, 34], [cx + 14, 56], [cx + 10, 70]], 4, 'k', 3);

  // tilki gözleri
  f.set(cx - 3, 15, 'Y'); f.set(cx + 3, 15, 'Y'); f.set(cx - 4, 15, 'K'); f.set(cx + 4, 15, 'K');
  f.path([[cx - 2, 20], [cx + 2, 20]], 1, 'B');
  f.outline();
  return f.g;
}
function figTilki() {
  const f = FigP(60, 44);
  f.path([[46, 28], [54, 18], [58, 8], [54, 4]], 6, 'r', 4); f.ell(55, 5, 3, 3, 'M');

  f.set(0, 24, 'K'); f.set(11, 19, 'Y'); f.set(10, 19, 'K');

}

// ---- Savaşta yoldaş şeridi ----
function yoldasSahne(sahne, scl, W, H, ayakY) {
  if (!C || !C.allies || !C.allies.length) return;
  const r = el('div', 'yoldaslar');
  C.allies.forEach(id => {
    const Y = YOLDAS[id];
    const figKey = id === 'belen' ? (C.belenAfet > 0 || C.belenDondu ? 'belen' : 'tilki') : Y.fig;
    const d = el('div', 'yoldas'); d.dataset.y = id; d.dataset.ac = 'y_' + id;
    const g = FIGS[figKey]();
    const k = clamp(Math.floor(Math.min(40 / g[0].length, 44 / g.length) * 4) / 4, 0.25, 1);
    const kut = el('div', 'ykut'); kut.appendChild(paintedCanvas('_fig_' + figKey, k, { grid: g, hires: true }));
    d.appendChild(kut);
    d.appendChild(el('span', 'yad', Y.ad + (guven(id) ? ' <i>' + '◆'.repeat(guven(id)) + '</i>' : '')));
    r.appendChild(d);
  });
  sahne.appendChild(r);
}
